<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#090b12" />
<meta name="description" content="Contact Se3rForIQD for questions, corrections, or feedback." />
<meta name="robots" content="index,follow" />
<link rel="canonical" href="https://se3rforiqd.xyz/contact.html" />
<title>Contact · Se3rForIQD</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  a,button{outline:none}
  html{height:100%}
  :root{
    --dark:#090b12; --dark-2:rgba(255,255,255,.045); --dark-3:rgba(255,255,255,.065);
    --line:rgba(255,255,255,.09); --line-strong:rgba(255,255,255,.16);
    --paper:#e9ecf8; --paper-dim:#9aa2bd; --paper-dim2:#6b7390; --violet:#8b98ff; --violet-dim:#7c93ff;
  }
  body{
    background:
      radial-gradient(1000px 560px at 8% -10%, rgba(139,152,255,.14), transparent 55%),
      radial-gradient(800px 460px at 100% 0%, rgba(34,211,238,.08), transparent 50%),
      var(--dark);
    background-attachment:fixed;
    color:var(--paper);font-family:"Work Sans",-apple-system,sans-serif;
    min-height:100%;line-height:1.65;-webkit-font-smoothing:antialiased;
  }
  .topbar{
    position:sticky;top:0;z-index:30;
    display:flex;align-items:center;gap:16px;
    padding:max(calc(env(safe-area-inset-top) + 4px), 16px) 18px 14px;
    border-bottom:1px solid var(--line);background:rgba(9,11,18,.72);backdrop-filter:blur(16px);
  }
  .back-btn{
    width:40px;height:40px;background:var(--dark-2);border:1px solid var(--line);border-radius:11px;
    color:var(--paper);text-decoration:none;display:flex;align-items:center;justify-content:center;
    flex-shrink:0;transition:background .18s,border-color .18s;
  }
  .back-btn:hover{background:var(--dark-3);border-color:var(--line-strong)}
  .title{flex:1;text-align:center;font-family:"Fraunces",serif;font-weight:600;font-size:18px;letter-spacing:.005em;margin:0}
  .wrap{max-width:640px;margin:0 auto;padding:28px 20px 48px}
  @media (min-width:900px){ .wrap{padding-top:52px;padding-bottom:64px} }
  p{font-size:14px;color:var(--paper-dim);line-height:1.7}
  a{color:var(--violet-dim)}
  .card{background:var(--dark-2);border:1px solid var(--line);border-radius:20px;padding:20px 22px;margin-top:16px}
  .contact-row{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit}
  .contact-ic{
    width:40px;height:40px;border-radius:12px;background:rgba(139,152,255,.14);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--violet-dim);
  }
  .contact-label{font-size:10.5px;color:var(--paper-dim2);text-transform:uppercase;letter-spacing:.06em}
  .contact-value{font-size:15px;font-weight:600;color:var(--paper);margin-top:3px}
</style>
<script>
  document.addEventListener("DOMContentLoaded", function(){
    var backBtn = document.getElementById("backBtn");
    if(backBtn) backBtn.addEventListener("click", function(e){
      if(history.length > 1){ e.preventDefault(); history.back(); }
    });
  });
</script>
</head>
<body>

<div class="topbar">
  <a href="index.html" class="back-btn" id="backBtn" aria-label="Back"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></a>
  <h1 class="title">Contact</h1>
  <div style="width:40px;"></div>
</div>

<div class="wrap">
  <p>Questions, corrections, or feedback about rates, the site, or the app — reach out any time.</p>

  <div class="card">
    <a class="contact-row" href="mailto:info@xzeenwaves.us">
      <span class="contact-ic"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></span>
      <span>
        <div class="contact-label">Email</div>
        <div class="contact-value">info@xzeenwaves.us</div>
      </span>
    </a>
  </div>
</div>

</body>
</html>
