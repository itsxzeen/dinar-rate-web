<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Rate History · Se3rForIQD</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="shortcut icon" href="favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  ::view-transition-old(root),::view-transition-new(root){animation-duration:.32s;animation-timing-function:ease-in-out;}
  html[data-vt-dir="forward"]::view-transition-old(root){animation-name:vt-out-left;}
  html[data-vt-dir="forward"]::view-transition-new(root){animation-name:vt-in-right;}
  html[data-vt-dir="back"]::view-transition-old(root){animation-name:vt-out-right;}
  html[data-vt-dir="back"]::view-transition-new(root){animation-name:vt-in-left;}
  @keyframes vt-out-left{to{transform:translateX(-25%);}}
  @keyframes vt-in-right{from{transform:translateX(100%);}to{transform:translateX(0);}}
  @keyframes vt-out-right{to{transform:translateX(100%);}}
  @keyframes vt-in-left{from{transform:translateX(-100%);}to{transform:translateX(0);}}
  *{box-sizing:border-box;margin:0;padding:0}
  html{height:100%}
  body{
    background:#000000;color:#ffffff;font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;
    min-height:100%;line-height:1.5;
  }
  .topbar{
    position:sticky;top:0;z-index:30;
    display:flex;align-items:center;gap:16px;
    padding:max(calc(env(safe-area-inset-top) + 4px), 16px) 18px 14px;
    border-bottom:1px solid rgba(255,255,255,.12);background:#000000;
  }
  .back-btn{
    width:44px;height:44px;background:#1c1c1e;border:1px solid #3a3a3c;border-radius:14px;
    color:#ffffff;font-size:20px;text-decoration:none;display:flex;align-items:center;justify-content:center;
  }
  .title{flex:1;text-align:center;font-size:20px;font-weight:900;letter-spacing:1px;}
  .wrap{max-width:520px;margin:0 auto;padding:20px 18px 40px;}
  .city-tabs{display:flex;gap:8px;margin-bottom:18px;}
  .city-tab{
    flex:1;text-align:center;padding:10px;border-radius:10px;border:1px solid #3a3a3c;
    background:#1c1c1e;color:#ffffff;cursor:pointer;font-weight:700;font-size:13px;
  }
  .city-tab.active{background:#ffffff;color:#000000;border-color:transparent;}
  .row{
    display:flex;justify-content:space-between;align-items:center;
    padding:14px;border-bottom:1px solid rgba(255,255,255,.08);font-family:"IBM Plex Mono",monospace;
  }
  .row:last-child{border-bottom:none;}
  .row .time{font-size:11px;opacity:.7;}
  .row .iqd{font-weight:700;font-size:16px;}
  .card{background:#1c1c1e;border:1px solid #3a3a3c;border-radius:16px;overflow:hidden;}
  .empty{padding:30px;text-align:center;opacity:.7;font-size:13px;}
</style>
<script>
  (function(){
    // Slide page transitions are an iOS-app-only affectation — plain web
    // browsers get no @view-transition rule injected, so navigation is instant.
    if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) {
      var s = document.createElement("style");
      s.textContent = "@view-transition{navigation:auto;}";
      document.head.appendChild(s);
    }
    function markDir(){
      var dir = "forward";
      try {
        if (window.navigation && navigation.activation && navigation.activation.navigationType === "traverse") {
          var from = navigation.activation.from, entry = navigation.activation.entry;
          if (from && entry && entry.index < from.index) dir = "back";
        }
      } catch(e){}
      document.documentElement.setAttribute("data-vt-dir", dir);
    }
    markDir();
    document.addEventListener("pagereveal", markDir);
    document.addEventListener("DOMContentLoaded", function(){
      var backBtn = document.getElementById("backBtn");
      if(backBtn) backBtn.addEventListener("click", function(e){
        if(history.length > 1){ e.preventDefault(); history.back(); }
      });
    });
  })();
</script>
</head>
<body>

<div class="topbar">
  <a href="index.html" class="back-btn" id="backBtn" aria-label="Back">←</a>
  <div class="title">Rate History</div>
  <div style="width:44px;"></div>
</div>

<div class="wrap">
  <div class="city-tabs" id="cityTabs">
    <div class="city-tab active" data-city="erbil">Erbil</div>
    <div class="city-tab" data-city="baghdad">Baghdad</div>
  </div>
  <div class="card">
    <div id="list" class="empty">Loading…</div>
  </div>
</div>

<script>
  var WORKER_URL = "https://dinar-rate-worker.dollersdaner.workers.dev";

  function fmt(n){ return n==null ? "—" : Math.round(n).toLocaleString("en-US"); }

  function formatTime(iso){
    var d = new Date(iso.replace(" ", "T")+"Z");
    return d.toLocaleString("en-US", { month:"short", day:"numeric", hour:"2-digit", minute:"2-digit" });
  }

  function loadHistory(city){
    document.querySelectorAll(".city-tab").forEach(function(t){
      t.classList.toggle("active", t.getAttribute("data-city") === city);
    });
    var list = document.getElementById("list");
    list.className = "empty";
    list.textContent = "Loading…";
    fetch(WORKER_URL+"/rate/history?city="+city+"&limit=20")
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(!d.history || !d.history.length){
          list.className = "empty";
          list.textContent = "No history yet — check back after the next update.";
          return;
        }
        list.className = "";
        var html = "";
        d.history.forEach(function(item){
          html += '<div class="row">'+
            '<span class="time">'+formatTime(item.recorded_at)+'</span>'+
            '<span class="iqd">'+fmt(item.rate)+' IQD</span>'+
            '</div>';
        });
        list.innerHTML = html;
      })
      .catch(function(){
        list.className = "empty";
        list.textContent = "Couldn't load history right now.";
      });
  }

  document.getElementById("cityTabs").addEventListener("click", function(e){
    var tab = e.target.closest(".city-tab");
    if(!tab) return;
    loadHistory(tab.getAttribute("data-city"));
  });

  loadHistory("erbil");
</script>

</body>
</html>
