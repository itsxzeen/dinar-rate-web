<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#020a1a" />
<meta name="description" content="Contact Se3rForIQD for questions, corrections, or feedback." />
<title>Contact · Se3rForIQD</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="shortcut icon" href="favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  a,button{outline:none}
  html{height:100%}
  body{
    background:#020a1a;color:#ffffff;font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;
    min-height:100%;line-height:1.6;
  }
  .topbar{
    position:sticky;top:0;z-index:30;
    display:flex;align-items:center;gap:16px;
    padding:max(calc(env(safe-area-inset-top) + 4px), 16px) 18px 14px;
    border-bottom:1px solid rgba(255,255,255,.12);background:#020a1a;
  }
  .back-btn{
    width:44px;height:44px;background:#071b3d;border:none;border-radius:14px;
    color:#ffffff;font-size:20px;text-decoration:none;display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .back-btn:active{background:#0c2c5c;}
  .title{flex:1;text-align:center;font-size:17px;font-weight:900;letter-spacing:.5px;}
  .wrap{max-width:520px;margin:0 auto;padding:24px 20px 40px;}
  p{font-size:13px;color:#98989d;}
  .card{background:linear-gradient(135deg, rgba(255,255,255,.06), transparent);border:none;border-radius:22px;box-shadow:0 8px 30px rgba(0,0,0,.35);padding:18px 20px;margin-top:16px;}
  .contact-row{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;}
  .contact-ic{
    width:38px;height:38px;border-radius:11px;background:#0c2c5c;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#5b9cff;
  }
  .contact-label{font-size:11px;color:#636366;text-transform:uppercase;letter-spacing:.05em;}
  .contact-value{font-size:15px;font-weight:700;color:#ffffff;margin-top:2px;}
</style>
<script>
  document.addEventListener("DOMContentLoaded", function(){
    var backBtn = document.getElementById("backBtn");
    if(backBtn) backBtn.addEventListener("click", function(e){
      if(history.length > 1){ e.preventDefault(); history.back(); }
    });
  });
</script>
</head>
<body>

<div class="topbar">
  <a href="index.html" class="back-btn" id="backBtn" aria-label="Back"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></a>
  <div class="title">Contact</div>
  <div style="width:44px;"></div>
</div>

<div class="wrap">
  <p>Questions, corrections, or feedback about rates, the site, or the app — reach out any time.</p>

  <div class="card">
    <a class="contact-row" href="mailto:info@xzeenwaves.us">
      <span class="contact-ic"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></span>
      <span>
        <div class="contact-label">Email</div>
        <div class="contact-value">info@xzeenwaves.us</div>
      </span>
    </a>
  </div>
</div>

</body>
</html>
