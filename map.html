<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#090b12" />
<meta name="description" content="Find currency exchange shops near you on a live map." />
<meta name="robots" content="index,follow" />
<link rel="canonical" href="https://se3rforiqd.xyz/map.html" />
<title>Map · Se3rForIQD</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  a,button{outline:none}
  html,body{height:100%}
  :root{
    --dark:#090b12; --dark-2:rgba(255,255,255,.045); --dark-3:rgba(255,255,255,.065);
    --line:rgba(255,255,255,.09); --line-strong:rgba(255,255,255,.16);
    --paper:#e9ecf8; --paper-dim:#9aa2bd; --paper-dim2:#6b7390; --violet:#8b98ff; --violet-dim:#7c93ff;
  }
  body{
    background:var(--dark);color:var(--paper);font-family:"Work Sans",-apple-system,sans-serif;
    line-height:1.5;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased;
  }
  .topbar{
    position:relative;z-index:30;flex-shrink:0;
    display:flex;align-items:center;gap:16px;
    padding:max(calc(env(safe-area-inset-top) + 4px), 16px) 18px 14px;
    border-bottom:1px solid var(--line);background:rgba(9,11,18,.9);
  }
  .back-btn, .refresh-btn{
    width:40px;height:40px;background:var(--dark-2);border:1px solid var(--line);border-radius:11px;
    color:var(--paper);text-decoration:none;display:flex;align-items:center;justify-content:center;
    flex-shrink:0;cursor:pointer;transition:background .18s,border-color .18s;
  }
  .back-btn:hover, .refresh-btn:hover{background:var(--dark-3);border-color:var(--line-strong)}
  .title{flex:1;text-align:center;font-family:"Fraunces",serif;font-weight:600;font-size:17px;letter-spacing:.005em}

  #mapArea{position:relative;flex:1 1 auto;min-height:0}
  #map{position:absolute;inset:0;background:#12141f}
  #mapStatus{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:12px;padding:24px;text-align:center;background:var(--dark);z-index:5;
  }
  #mapStatus.hidden{display:none}
  #mapStatus p{font-size:13px;color:var(--paper-dim);max-width:280px}
  .spinner{
    width:26px;height:26px;border-radius:50%;border:3px solid var(--line-strong);
    border-top-color:var(--violet-dim);animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .retry-btn{
    background:var(--dark-2);border:1px solid var(--line-strong);color:var(--paper);border-radius:999px;
    padding:9px 18px;font-size:13px;font-weight:700;cursor:pointer;
  }

  #sheet{
    flex-shrink:0;max-height:38vh;overflow-y:auto;background:#0f1220;
    border-top:1px solid var(--line);padding:6px 0 calc(10px + env(safe-area-inset-bottom));
  }
  @media (min-width:900px){
    #sheet{max-width:600px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line);border-radius:16px 16px 0 0}
  }

  #sheetHandle{width:36px;height:4px;background:var(--line-strong);border-radius:999px;margin:8px auto 4px}
  .shop-row{
    display:flex;gap:12px;align-items:flex-start;padding:12px 16px;
    border-bottom:1px solid var(--line);cursor:pointer;
  }
  .shop-row:last-child{border-bottom:none}
  .shop-ic{
    width:34px;height:34px;border-radius:10px;background:rgba(139,152,255,.14);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--violet-dim);margin-top:2px;
  }
  .shop-name{font-size:14px;font-weight:600;color:var(--paper)}
  .shop-addr{font-size:12px;color:var(--paper-dim);margin-top:2px}
  .shop-meta{font-size:11px;color:var(--paper-dim2);margin-top:4px;display:flex;gap:8px;align-items:center}
  .shop-open{color:#3ddc9a}
  .shop-closed{color:#fb7185}
  .shop-empty{padding:24px;text-align:center;color:var(--paper-dim2);font-size:13px}
  .coming-soon{padding:36px 20px;text-align:center}
  .coming-soon .cs-title{font-family:"Fraunces",serif;font-size:19px;font-weight:600;color:var(--paper)}
  .coming-soon .cs-sub{font-size:13px;color:var(--paper-dim);margin-top:8px}

  /* Leaflet dark-theme overrides */
  .leaflet-container{background:#12141f;font-family:"Work Sans",system-ui,sans-serif}
  .leaflet-control-zoom a{background:var(--dark-2) !important;color:var(--paper) !important;border-color:var(--line) !important}
  .leaflet-control-zoom a:hover{background:var(--dark-3) !important}
  .leaflet-control-attribution{background:rgba(9,11,18,.75) !important;color:var(--paper-dim) !important}
  .leaflet-control-attribution a{color:var(--violet-dim) !important}
  .leaflet-popup-content-wrapper{background:#0f1220;color:var(--paper);border-radius:12px}
  .leaflet-popup-tip{background:#0f1220}
  .leaflet-popup-content{margin:12px 14px;font-size:13px}
  .user-dot{width:16px;height:16px;border-radius:50%;background:var(--violet-dim);border:3px solid #fff;box-shadow:0 0 0 4px rgba(139,152,255,.35)}
  .shop-pin{width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:var(--violet-dim);border:2px solid #fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 2px 6px rgba(0,0,0,.4)}
  .shop-pin svg{transform:rotate(45deg);width:14px;height:14px;color:#0a0b14}
</style>
</head>
<body>

<div class="topbar">
  <a href="index.html" class="back-btn" id="backBtn" aria-label="Back"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></a>
  <h1 class="title" data-i18n="mapTitle">Map</h1>
  <button class="refresh-btn" id="refreshBtn" type="button" aria-label="Refresh"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
</div>

<div id="mapArea">
  <div id="map"></div>
  <div id="mapStatus">
    <div class="spinner"></div>
    <p id="mapStatusText" data-i18n="findingLocation">Finding your location…</p>
  </div>
</div>

<div id="sheet">
  <div id="sheetHandle"></div>
  <div id="shopList"><div class="coming-soon"><div class="cs-title">Coming Soon</div><div class="cs-sub">Nearby exchange shop listings are on the way.</div></div></div>
</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  document.getElementById("backBtn").addEventListener("click", function(e){
    if(history.length > 1){ e.preventDefault(); history.back(); }
  });

  var WORKER_URL = "https://dinar-rate-worker.dollersdaner.workers.dev";

  // Nav labels + page chrome follow the language picked in Profile.
  var LANG_KEY = "lang_v1";
  var I18N = {
    en: { mapTitle:"Map", loadingShops:"Loading nearby shops…", noShops:"No currency exchange shops found nearby.",
      couldntLoad:"Couldn't load nearby shops right now.", findingLocation:"Finding your location…",
      navHome:"Home", navMap:"Map", navConvert:"Convert", navGold:"Gold", navProfile:"Profile" },
    ar: { mapTitle:"الخريطة", loadingShops:"جاري تحميل الصرافات القريبة…", noShops:"لا توجد صرافات قريبة.",
      couldntLoad:"تعذر تحميل الصرافات الآن.", findingLocation:"جاري تحديد موقعك…",
      navHome:"الرئيسية", navMap:"الخريطة", navConvert:"تحويل", navGold:"الذهب", navProfile:"الملف" },
    ku: { mapTitle:"نەخشە", loadingShops:"بارکردنی صەڕافە نزیکەکان…", noShops:"هیچ صەڕافێکی نزیک نەدۆزرایەوە.",
      couldntLoad:"نەتوانرا صەڕافەکان باربکرێن.", findingLocation:"دۆزینەوەی شوێنەکەت…",
      navHome:"ماڵەوە", navMap:"نەخشە", navConvert:"گۆڕین", navGold:"زێڕ", navProfile:"پرۆفایل" },
  };
  var currentLang = localStorage.getItem(LANG_KEY) || "en";
  function t(key){ return (I18N[currentLang] && I18N[currentLang][key]) || I18N.en[key] || key; }
  function applyLang(){
    document.documentElement.lang = currentLang;
    document.querySelectorAll("[data-i18n]").forEach(function(el){
      var v = t(el.getAttribute("data-i18n"));
      if (v != null) el.textContent = v;
    });
  }
  applyLang();
  var DEFAULT_CENTER = { lat: 36.1911, lng: 44.0092 }; // Erbil, fallback if geolocation fails
  var map = null;
  var markers = [];
  var userMarker = null;

  var ICON_SHOP = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 6.5c0-1.9-2.2-3.5-5-3.5s-5 1.4-5 3.3c0 1.9 2 2.8 5 3.2s5 1.3 5 3.2c0 1.9-2.2 3.3-5 3.3s-5-1.6-5-3.5"/></svg>';

  var pinIcon = L.divIcon({
    className: "",
    html: '<div class="shop-pin">' + ICON_SHOP + '</div>',
    iconSize: [30, 30],
    iconAnchor: [15, 28],
    popupAnchor: [0, -26],
  });
  var userIcon = L.divIcon({
    className: "",
    html: '<div class="user-dot"></div>',
    iconSize: [16, 16],
    iconAnchor: [8, 8],
  });

  function setStatus(text, showRetry){
    var el = document.getElementById("mapStatus");
    var textEl = document.getElementById("mapStatusText");
    if(text == null){ el.classList.add("hidden"); return; }
    el.classList.remove("hidden");
    textEl.textContent = "";
    var spinner = el.querySelector(".spinner");
    if(showRetry){
      if(spinner) spinner.style.display = "none";
      textEl.textContent = text;
      var btn = document.getElementById("statusRetryBtn");
      if(!btn){
        btn = document.createElement("button");
        btn.id = "statusRetryBtn";
        btn.className = "retry-btn";
        btn.textContent = "Retry";
        btn.addEventListener("click", init);
        el.appendChild(btn);
      }
    } else {
      if(spinner) spinner.style.display = "";
      textEl.textContent = text;
      var existingBtn = document.getElementById("statusRetryBtn");
      if(existingBtn) existingBtn.remove();
    }
  }

  function fmtDistance(km){
    if(km < 1) return Math.round(km*1000) + "m away";
    return km.toFixed(1) + "km away";
  }
  function distanceKm(lat1, lng1, lat2, lng2){
    var R = 6371;
    var dLat = (lat2-lat1) * Math.PI/180;
    var dLng = (lng2-lng1) * Math.PI/180;
    var a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  function clearMarkers(){
    markers.forEach(function(m){ map.removeLayer(m); });
    markers = [];
  }

  function popupHtml(p){
    return '<div style="color:#111;font-family:inherit;min-width:160px;">'
      + '<div style="font-weight:700;font-size:13px;">'+p.name+'</div>'
      + (p.address ? '<div style="font-size:12px;color:#555;margin-top:2px;">'+p.address+'</div>' : '')
      + (p.phone ? '<div style="font-size:12px;color:#555;margin-top:4px;">'+p.phone+'</div>' : '')
      + '</div>';
  }

  function renderShops(center, places){
    clearMarkers();
    var listEl = document.getElementById("shopList");
    if(!places.length){
      listEl.innerHTML = '<div class="shop-empty">' + t("noShops") + '</div>';
      return;
    }
    places.sort(function(a,b){
      if(a.lat==null || b.lat==null) return 0;
      return distanceKm(center.lat, center.lng, a.lat, a.lng) - distanceKm(center.lat, center.lng, b.lat, b.lng);
    });
    listEl.innerHTML = "";
    places.forEach(function(p){
      if(p.lat == null || p.lng == null) return;
      var marker = L.marker([p.lat, p.lng], { icon: pinIcon, title: p.name }).addTo(map);
      marker.bindPopup(popupHtml(p));
      markers.push(marker);

      var dist = distanceKm(center.lat, center.lng, p.lat, p.lng);
      var row = document.createElement("div");
      row.className = "shop-row";
      row.innerHTML =
        '<div class="shop-ic">'+ICON_SHOP+'</div>'
        + '<div>'
        +   '<div class="shop-name">'+p.name+'</div>'
        +   (p.address ? '<div class="shop-addr">'+p.address+'</div>' : '')
        +   '<div class="shop-meta">'
        +     '<span>'+fmtDistance(dist)+'</span>'
        +     (p.rating!=null ? '<span>★ '+p.rating+'</span>' : '')
        +     (p.openNow===true ? '<span class="shop-open">Open now</span>' : p.openNow===false ? '<span class="shop-closed">Closed</span>' : '')
        +   '</div>'
        + '</div>';
      row.addEventListener("click", function(){
        map.setView([p.lat, p.lng], 16, { animate: true });
        marker.openPopup();
      });
      listEl.appendChild(row);
    });
  }

  // Shop search isn't live yet (backend dependency pending) — skip the
  // fetch entirely and leave the "Coming Soon" placeholder in place.
  var SHOP_SEARCH_ENABLED = false;

  function loadShops(center){
    if(!SHOP_SEARCH_ENABLED) return;
    document.getElementById("shopList").innerHTML = '<div class="shop-empty">' + t("loadingShops") + '</div>';
    fetch(WORKER_URL + "/places/nearby?lat=" + center.lat + "&lng=" + center.lng)
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d.error){
          document.getElementById("shopList").innerHTML = '<div class="shop-empty">' + t("couldntLoad") + '</div>';
          return;
        }
        renderShops(center, d.places || []);
      })
      .catch(function(){
        document.getElementById("shopList").innerHTML = '<div class="shop-empty">' + t("couldntLoad") + '</div>';
      });
  }

  function setupMap(center){
    if(!map){
      map = L.map("map", { zoomControl: true, attributionControl: true }).setView([center.lat, center.lng], 14);
      L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
        maxZoom: 19,
        subdomains: "abcd",
      }).addTo(map);
    } else {
      map.setView([center.lat, center.lng], 14);
    }
    if(userMarker) map.removeLayer(userMarker);
    userMarker = L.marker([center.lat, center.lng], { icon: userIcon, title: "You are here" }).addTo(map);
    setStatus(null);
    loadShops(center);
  }

  function init(){
    setStatus(t("findingLocation"), false);
    if(!navigator.geolocation){
      setupMap(DEFAULT_CENTER);
      return;
    }
    navigator.geolocation.getCurrentPosition(
      function(pos){
        setupMap({ lat: pos.coords.latitude, lng: pos.coords.longitude });
      },
      function(){
        setupMap(DEFAULT_CENTER);
      },
      { timeout: 8000, maximumAge: 60000 }
    );
  }

  document.getElementById("refreshBtn").addEventListener("click", function(){
    if(map){
      var c = map.getCenter();
      loadShops({ lat: c.lat, lng: c.lng });
    } else {
      init();
    }
  });

  // Admin kill-switch: if the map page is turned off, show a notice instead.
  fetch(WORKER_URL + "/flags").then(function(r){ return r.json(); }).then(function(d){
    if(d.flags && d.flags.site_operational === false){
      document.body.innerHTML = '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:#090b12;color:#fff;font-family:system-ui,sans-serif"><div style="font-size:40px;margin-bottom:12px">🛠️</div><div style="font-size:18px;font-weight:700;margin-bottom:8px">Down for maintenance</div><div style="font-size:14px;color:#9aa2bd;max-width:320px">Se3rForIQD is temporarily unavailable while we fix something. Please check back soon.</div></div>';
      return;
    }
    if(d.flags && d.flags.page_map === false){
      var area = document.getElementById("mapArea");
      var sheet = document.getElementById("sheet");
      if(sheet) sheet.style.display = "none";
      if(area) area.innerHTML = '<div id="mapStatus"><p>This page is temporarily unavailable.</p></div>';
    }
  }).catch(function(){});

  init();
</script>

</body>
</html>
