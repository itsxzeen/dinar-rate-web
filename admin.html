<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<meta name="theme-color" content="#0a0108" />
<title>Se3rForIQD · Admin</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --dark:#000000; --dark-2:#1c1c1e; --dark-3:#2c2c2e;
    --purple:#3a3a3c; --purple-light:#0a84ff; --purple-dark:#0060df;
    --paper:#ffffff; --paper-dim:#98989d; --accent:#30d158; --danger:#ff453a; --muted:#636366;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--dark); color:var(--paper);
    font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;
    min-height:100vh; padding:20px 16px 60px;
  }
  .wrap{max-width:640px;margin:0 auto}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
  .brand{font-family:"Sora",sans-serif;font-weight:800;font-size:20px;letter-spacing:.5px}
  .brand span{color:var(--purple-light)}
  a.back{color:var(--paper-dim);font-size:13px;text-decoration:none}

  .card{background:var(--dark-2);border:1px solid var(--purple);border-radius:16px;padding:18px;margin-bottom:16px}
  .card h2{font-size:14px;font-weight:700;letter-spacing:1px;color:var(--paper-dim);text-transform:uppercase;margin-bottom:14px}

  .input{width:100%;background:var(--dark-3);border:1px solid var(--purple);border-radius:12px;
    color:var(--paper);font-size:15px;padding:13px 14px;outline:none;font-family:inherit}
  .input:focus{border-color:var(--purple-light)}
  .btn{width:100%;background:var(--purple-light);color:#fff;border:none;border-radius:12px;
    font-size:15px;font-weight:700;padding:13px;cursor:pointer;margin-top:10px}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:var(--dark-3);border:1px solid var(--purple);color:var(--paper)}
  .btn.danger{background:transparent;border:1px solid var(--danger);color:var(--danger)}
  .btn.small{width:auto;padding:9px 16px;font-size:13px;margin-top:0}
  .msg{font-size:12px;color:var(--paper-dim);margin-top:10px;min-height:14px;text-align:center}

  #dashboard{display:none}

  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
  .stat{background:var(--dark-3);border-radius:12px;padding:14px;text-align:center}
  .stat.live .stat-num{color:var(--accent)}
  .stat-num{font-family:"IBM Plex Mono",monospace;font-size:24px;font-weight:700}
  .stat-lbl{font-size:11px;color:var(--paper-dim);margin-top:4px;display:flex;align-items:center;justify-content:center;gap:5px}
  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block;animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  .bar-row{margin-bottom:12px}
  .bar-row:last-child{margin-bottom:0}
  .bar-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
  .bar-top .lbl{color:var(--paper-dim)}
  .bar-top .val{font-family:"IBM Plex Mono",monospace;font-weight:700}
  .bar-track{height:8px;background:var(--dark-3);border-radius:4px;overflow:hidden}
  .bar-fill{height:100%;background:var(--purple-light);border-radius:4px;transition:width .4s}

  .rate-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .rate-city{font-weight:700;font-size:15px;width:70px}
  .rate-live{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--paper-dim);flex:1}
  .rate-tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--purple-light);color:#fff;white-space:nowrap}
  .rate-edit{display:flex;gap:8px;margin-top:2px}
  .rate-edit .input{flex:1}
  .rate-edit .btn{width:auto;white-space:nowrap}

  table{width:100%;border-collapse:collapse;font-size:12px}
  th{text-align:left;color:var(--paper-dim);font-weight:600;padding:6px 6px;border-bottom:1px solid var(--purple)}
  td{padding:7px 6px;border-bottom:1px solid var(--dark-3);font-family:"IBM Plex Mono",monospace}
  .tag{font-size:10px;padding:2px 6px;border-radius:5px;background:var(--dark-3);color:var(--paper-dim)}
  .empty{color:var(--paper-dim);font-size:13px;text-align:center;padding:14px 0}

  .flag-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--dark-3)}
  .flag-row:last-child{border-bottom:none}
  .flag-label{font-size:13px;font-weight:600}
  .flag-toggle{border:1px solid var(--purple);background:var(--dark-3);color:var(--paper-dim);
    font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;
    padding:6px 14px;cursor:pointer;flex-shrink:0;transition:background .2s,color .2s,border-color .2s}
  .flag-toggle.on{background:var(--accent);border-color:var(--accent);color:#04150a}
  .flag-toggle.off{background:var(--danger);border-color:var(--danger);color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">Se3r<span>ForIQD</span> Admin</div>
    <a class="back" href="index.html"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M19 12H5M11 6l-6 6 6 6"/></svg> Site</a>
  </div>

  <div id="loginCard" class="card">
    <h2>Admin Login</h2>
    <input class="input" id="admPass" type="password" inputmode="numeric" placeholder="Passcode" autocomplete="off" />
    <button class="btn" id="admLoginBtn">Enter</button>
    <div class="msg" id="admMsg"></div>
  </div>

  <div id="dashboard">
    <div class="card">
      <h2>Rates</h2>
      <div id="rateRows"></div>
      <div class="msg" id="rateMsg"></div>
    </div>

    <div class="card">
      <h2>Controls</h2>
      <div id="flagRows"></div>
      <div class="msg" id="flagMsg"></div>
    </div>

    <div class="card">
      <h2>Live</h2>
      <div class="stat-grid">
        <div class="stat live"><div class="stat-num" id="stOnline">—</div><div class="stat-lbl"><span class="live-dot"></span>Online now</div></div>
        <div class="stat"><div class="stat-num" id="stToday">—</div><div class="stat-lbl">Views today</div></div>
        <div class="stat"><div class="stat-num" id="stTotal">—</div><div class="stat-lbl">Total views</div></div>
        <div class="stat"><div class="stat-num" id="stUnique">—</div><div class="stat-lbl">Unique visitors</div></div>
      </div>
    </div>

    <div class="card">
      <h2>Website vs App</h2>
      <div id="platformBars"><div class="empty">—</div></div>
    </div>

    <div class="card">
      <h2>Phone vs Desktop</h2>
      <div id="deviceBars"><div class="empty">—</div></div>
    </div>

    <div class="card">
      <h2>Active now</h2>
      <table>
        <thead><tr><th>Visitor</th><th>Platform</th><th>Device</th><th>Last seen</th></tr></thead>
        <tbody id="activeRows"></tbody>
      </table>
      <div class="empty" id="activeEmpty" style="display:none">No one online right now.</div>
    </div>

    <button class="btn danger" id="admLogout">Log out</button>
  </div>
</div>

<script>
(function(){
  var WORKER_URL = "https://dinar-rate-worker.dollersdaner.workers.dev";
  var TOKEN_KEY = "adminToken_v1";
  var ADMIN_USER = "itsxzeen";
  var statsTimer = null;

  var loginCard = document.getElementById("loginCard");
  var dashboard = document.getElementById("dashboard");
  var admMsg = document.getElementById("admMsg");

  function isPhoneUA(ua){
    return /Mobile|iPhone|Android/i.test(ua || "");
  }
  function timeAgo(iso){
    if(!iso) return "—";
    var s = Math.max(0, Math.floor((Date.now() - new Date(iso.replace(" ","T")+"Z").getTime())/1000));
    if(s < 60) return s+"s ago";
    if(s < 3600) return Math.floor(s/60)+"m ago";
    return Math.floor(s/3600)+"h ago";
  }

  function showDashboard(){
    loginCard.style.display = "none";
    dashboard.style.display = "block";
    loadRates();
    loadStats();
    loadFlags();
    if(statsTimer) clearInterval(statsTimer);
    statsTimer = setInterval(loadStats, 10000);
  }
  function showLogin(msg){
    loginCard.style.display = "";
    dashboard.style.display = "none";
    admMsg.textContent = msg || "";
    if(statsTimer){ clearInterval(statsTimer); statsTimer = null; }
  }

  function authedFetch(path, opts){
    var token = localStorage.getItem(TOKEN_KEY);
    opts = opts || {};
    opts.headers = Object.assign({}, opts.headers, { "Authorization": "Bearer " + token });
    return fetch(WORKER_URL + path, opts).then(function(r){
      if(r.status === 401){
        localStorage.removeItem(TOKEN_KEY);
        showLogin("Session expired, log in again.");
        throw new Error("401");
      }
      return r.json();
    });
  }

  function admLogin(){
    var pass = document.getElementById("admPass").value || "";
    if(pass.length < 8){ admMsg.textContent = "Passcode must be at least 8 characters."; return; }
    admMsg.textContent = "Checking...";
    fetch(WORKER_URL+"/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({email:ADMIN_USER,password:pass})})
      .then(function(r){ return r.json().then(function(d){ return {ok:r.ok,d:d}; }); })
      .then(function(res){
        if(!res.ok){ admMsg.textContent = res.d.error || "Failed."; return; }
        if(res.d.token){ localStorage.setItem(TOKEN_KEY, res.d.token); showDashboard(); }
        else { admMsg.textContent = "Unexpected response."; }
      })
      .catch(function(){ admMsg.textContent = "Network error."; });
  }

  document.getElementById("admLoginBtn").addEventListener("click", admLogin);
  document.getElementById("admPass").addEventListener("keydown", function(e){ if(e.key==="Enter") admLogin(); });
  document.getElementById("admLogout").addEventListener("click", function(){
    localStorage.removeItem(TOKEN_KEY);
    showLogin();
  });

  /* ---------- rates ---------- */

  function renderRates(data){
    var rows = document.getElementById("rateRows");
    rows.innerHTML = "";
    ["baghdad","erbil"].forEach(function(city){
      var live = data.live[city];
      var override = data.overrides[city];
      var row = document.createElement("div");
      row.className = "rate-row";
      row.style.flexDirection = "column";
      row.style.alignItems = "stretch";

      var top = document.createElement("div");
      top.className = "rate-row";
      var label = document.createElement("div");
      label.className = "rate-city";
      label.textContent = city === "baghdad" ? "Baghdad" : "Erbil";
      var liveTxt = document.createElement("div");
      liveTxt.className = "rate-live";
      liveTxt.textContent = "Live: " + (live ? Number(live.rate).toLocaleString("en-US") : "—");
      top.appendChild(label);
      top.appendChild(liveTxt);
      if(override){
        var tag = document.createElement("div");
        tag.className = "rate-tag";
        tag.textContent = "OVERRIDE " + Number(override.rate).toLocaleString("en-US");
        top.appendChild(tag);
      }

      var edit = document.createElement("div");
      edit.className = "rate-edit";
      var input = document.createElement("input");
      input.className = "input";
      input.type = "number";
      input.placeholder = "New rate, e.g. 152900";
      input.value = override ? override.rate : "";
      var setBtn = document.createElement("button");
      setBtn.className = "btn small";
      setBtn.textContent = "Set";
      setBtn.addEventListener("click", function(){ setOverride(city, input.value); });
      edit.appendChild(input);
      edit.appendChild(setBtn);
      if(override){
        var clearBtn = document.createElement("button");
        clearBtn.className = "btn small ghost";
        clearBtn.textContent = "Use live";
        clearBtn.addEventListener("click", function(){ clearOverride(city); });
        edit.appendChild(clearBtn);
      }

      row.appendChild(top);
      row.appendChild(edit);
      rows.appendChild(row);
    });
  }

  function loadRates(){
    authedFetch("/admin/rates").then(renderRates).catch(function(){});
  }

  function setOverride(city, rateStr){
    var rate = parseInt(rateStr, 10);
    var msg = document.getElementById("rateMsg");
    if(!Number.isFinite(rate) || rate <= 0){ msg.textContent = "Enter a valid positive number."; return; }
    msg.textContent = "Saving...";
    authedFetch("/admin/rate", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({city:city, rate:rate})})
      .then(function(){ msg.textContent = "Saved."; loadRates(); })
      .catch(function(){ msg.textContent = "Failed to save."; });
  }

  function clearOverride(city){
    var msg = document.getElementById("rateMsg");
    msg.textContent = "Reverting...";
    authedFetch("/admin/rate?city="+city, {method:"DELETE"})
      .then(function(){ msg.textContent = "Reverted to live."; loadRates(); })
      .catch(function(){ msg.textContent = "Failed."; });
  }

  /* ---------- feature flags (kill switch) ---------- */

  var FLAG_LABELS = {
    page_history: "History Page",
    page_convert: "Convert Page",
    page_gold: "Gold Page",
    page_other_rates: "Other Rates Page",
    page_profile: "Profile Page (app)",
    btn_share: "Share Button",
    btn_notifications: "Notifications Toggle",
  };
  var lastFlags = {};

  function renderFlags(flags){
    lastFlags = flags;
    var wrap = document.getElementById("flagRows");
    wrap.innerHTML = "";
    Object.keys(FLAG_LABELS).forEach(function(key){
      var on = flags[key] !== false;
      var row = document.createElement("div");
      row.className = "flag-row";
      var label = document.createElement("span");
      label.className = "flag-label";
      label.textContent = FLAG_LABELS[key];
      var btn = document.createElement("button");
      btn.className = "flag-toggle " + (on ? "on" : "off");
      btn.textContent = on ? "On" : "Off";
      btn.addEventListener("click", function(){ setFlag(key, !on); });
      row.appendChild(label);
      row.appendChild(btn);
      wrap.appendChild(row);
    });
  }

  function loadFlags(){
    fetch(WORKER_URL + "/flags").then(function(r){ return r.json(); })
      .then(function(d){ renderFlags(d.flags || {}); }).catch(function(){});
  }

  function setFlag(key, enabled){
    var msg = document.getElementById("flagMsg");
    msg.textContent = "Saving...";
    authedFetch("/admin/flag", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({key:key, enabled:enabled})})
      .then(function(){ msg.textContent = "Saved."; loadFlags(); })
      .catch(function(){ msg.textContent = "Failed to save."; });
  }

  /* ---------- stats ---------- */

  function bar(label, value, total){
    var pct = total > 0 ? Math.round((value/total)*100) : 0;
    var wrap = document.createElement("div");
    wrap.className = "bar-row";
    wrap.innerHTML =
      '<div class="bar-top"><span class="lbl">'+label+'</span><span class="val">'+value.toLocaleString("en-US")+' ('+pct+'%)</span></div>' +
      '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%"></div></div>';
    return wrap;
  }

  function renderPlatform(byPlatform){
    var el = document.getElementById("platformBars");
    el.innerHTML = "";
    var web = 0, app = 0;
    (byPlatform||[]).forEach(function(row){
      if(row.platform === "ios-app") app += row.c; else web += row.c;
    });
    var total = web + app;
    if(total === 0){ el.innerHTML = '<div class="empty">No views yet.</div>'; return; }
    el.appendChild(bar("Website", web, total));
    el.appendChild(bar("iOS App", app, total));
  }

  function renderDevice(byDevice){
    var el = document.getElementById("deviceBars");
    el.innerHTML = "";
    var phone = (byDevice && byDevice.phone) || 0;
    var desktop = (byDevice && byDevice.desktop) || 0;
    var total = phone + desktop;
    if(total === 0){ el.innerHTML = '<div class="empty">No views yet.</div>'; return; }
    el.appendChild(bar("Phone", phone, total));
    el.appendChild(bar("Desktop", desktop, total));
  }

  function renderActive(active){
    var tbody = document.getElementById("activeRows");
    var empty = document.getElementById("activeEmpty");
    tbody.innerHTML = "";
    if(!active || !active.length){ empty.style.display = ""; return; }
    empty.style.display = "none";
    active.forEach(function(v){
      var tr = document.createElement("tr");
      var platform = v.platform === "ios-app" ? "iOS App" : "Website";
      var device = isPhoneUA(v.ua) ? "Phone" : "Desktop";
      tr.innerHTML =
        "<td>"+(v.visitor_id||"").slice(0,10)+"</td>" +
        "<td><span class='tag'>"+platform+"</span></td>" +
        "<td><span class='tag'>"+device+"</span></td>" +
        "<td>"+timeAgo(v.last_seen)+"</td>";
      tbody.appendChild(tr);
    });
  }

  function loadStats(){
    authedFetch("/admin/stats").then(function(d){
      document.getElementById("stOnline").textContent = d.onlineNow!=null ? d.onlineNow : "—";
      document.getElementById("stTotal").textContent = d.totalViews!=null ? Number(d.totalViews).toLocaleString("en-US") : "—";
      document.getElementById("stUnique").textContent = d.uniqueVisitors!=null ? Number(d.uniqueVisitors).toLocaleString("en-US") : "—";
      document.getElementById("stToday").textContent = d.today!=null ? Number(d.today).toLocaleString("en-US") : "—";
      renderPlatform(d.byPlatform);
      renderDevice(d.byDevice);
      renderActive(d.active);
    }).catch(function(){});
  }

  if(localStorage.getItem(TOKEN_KEY)) showDashboard();
  else showLogin();
})();
</script>
</body>
</html>
