<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#090b12" />
<meta name="description" content="Convert between USD, IQD, and other currencies at live rates." />
<meta name="robots" content="index,follow" />
<link rel="canonical" href="https://se3rforiqd.xyz/currency-converter.html" />
<title>Currency Converter · Se3rForIQD</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Work+Sans:wght@400;500;600;700&family=Fragment+Mono&display=swap" rel="stylesheet">
<style>
  ::view-transition-old(root),::view-transition-new(root){animation-duration:.32s;animation-timing-function:ease-in-out;}
  html[data-vt-dir="forward"]::view-transition-old(root){animation-name:vt-out-left;}
  html[data-vt-dir="forward"]::view-transition-new(root){animation-name:vt-in-right;}
  html[data-vt-dir="back"]::view-transition-old(root){animation-name:vt-out-right;}
  html[data-vt-dir="back"]::view-transition-new(root){animation-name:vt-in-left;}
  @keyframes vt-out-left{to{transform:translateX(-25%);}}
  @keyframes vt-in-right{from{transform:translateX(100%);}to{transform:translateX(0);}}
  @keyframes vt-out-right{to{transform:translateX(100%);}}
  @keyframes vt-in-left{from{transform:translateX(-100%);}to{transform:translateX(0);}}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{height:100%}
  :root{
    --dark:#090b12; --dark-2:rgba(255,255,255,.045); --dark-3:rgba(255,255,255,.065);
    --line:rgba(255,255,255,.09); --line-strong:rgba(255,255,255,.16);
    --paper:#e9ecf8; --paper-dim:#9aa2bd; --paper-dim2:#6b7390; --violet:#8b98ff; --violet-dim:#7c93ff;
  }
  body{
    background:
      radial-gradient(1000px 560px at 8% -10%, rgba(139,152,255,.14), transparent 55%),
      radial-gradient(800px 460px at 100% 0%, rgba(34,211,238,.08), transparent 50%),
      var(--dark);
    background-attachment:fixed;
    color:var(--paper);font-family:"Work Sans",-apple-system,sans-serif;
    min-height:100%;line-height:1.5;-webkit-font-smoothing:antialiased;
  }
  .topbar{
    position:sticky;top:0;z-index:30;
    display:flex;align-items:center;gap:16px;
    padding:max(calc(env(safe-area-inset-top) + 4px), 16px) 18px 14px;
    border-bottom:1px solid var(--line);background:rgba(9,11,18,.72);backdrop-filter:blur(16px);
  }
  .back-btn{
    width:40px;height:40px;background:var(--dark-2);border:1px solid var(--line);border-radius:11px;
    color:var(--paper);text-decoration:none;display:flex;align-items:center;justify-content:center;
    flex-shrink:0;transition:background .18s,border-color .18s;
  }
  .back-btn:hover{background:var(--dark-3);border-color:var(--line-strong)}
  .title{flex:1;text-align:center;font-family:"Fraunces",serif;font-weight:600;font-size:18px;letter-spacing:.005em;margin:0}
  .wrap{max-width:460px;margin:0 auto;padding:36px 18px 40px}
  @media (min-width:900px){
    .wrap{max-width:520px;padding-top:60px}
  }

  .card{background:var(--dark-2);border:1px solid var(--line);border-radius:22px;padding:22px}
  .field{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--dark);border:1px solid var(--line);border-radius:14px;padding:16px;
  }
  .field input{
    flex:1;text-align:right;background:none;border:none;color:var(--paper);
    font-family:"Fragment Mono",monospace;font-size:22px;font-weight:700;outline:none;min-width:0;
  }
  .field input[readonly]{color:var(--cyan,#22d3ee)}
  .cur-chip{position:relative;display:flex;align-items:center;gap:6px;cursor:pointer;flex-shrink:0;
    font-size:14px;font-weight:700;color:var(--paper);user-select:none;border-radius:8px;padding:3px 6px;
    transition:background .3s ease,color .3s ease,transform .3s ease}
  #fromLabel.flash, #toLabel.flash{background:var(--violet-dim);color:#0a0b16;transform:scale(1.08);border-radius:6px;padding:2px 6px}
  .cur-chip::after{content:"▾";font-size:10px;color:var(--paper-dim2);margin-left:2px}
  .cur-popover{
    position:absolute;top:calc(100% + 8px);left:0;background:#0f1220;
    border:1px solid var(--line-strong);border-radius:12px;overflow:hidden;
    box-shadow:0 12px 32px rgba(0,0,0,.5);z-index:50;min-width:190px;display:none;
  }
  .cur-popover.open{display:block}
  .cur-search{
    display:block;width:100%;box-sizing:border-box;padding:10px 14px;border:none;
    border-bottom:1px solid var(--line);background:var(--dark);color:var(--paper);font-size:13px;
    font-family:inherit;outline:none;
  }
  .cur-search::placeholder{color:var(--paper-dim2)}
  .cur-opt-list{max-height:240px;overflow-y:auto}
  .cur-opt{
    display:flex;align-items:center;gap:8px;padding:11px 14px;font-size:13px;font-weight:600;
    color:var(--paper);white-space:nowrap;cursor:pointer;
  }
  .cur-opt:hover{background:var(--violet-dim);color:#0a0b14}
  .cur-opt:not(:last-child){border-bottom:1px solid var(--line)}

  .swap-btn{
    display:flex;align-items:center;justify-content:center;width:40px;height:40px;
    margin:-3px auto;border-radius:50%;border:3px solid var(--dark);background:var(--violet-dim);
    color:#0a0b14;cursor:pointer;position:relative;z-index:1;transition:transform .25s;
  }
  .swap-btn:hover{transform:rotate(180deg)}
  .rate-info{text-align:center;font-size:12px;color:var(--paper-dim2);margin-top:16px}
  .amount-chips{display:flex;gap:8px;margin-top:14px;justify-content:center;flex-wrap:wrap}
  .amount-chip{
    background:var(--dark-3);border:1px solid var(--line);color:var(--paper-dim);border-radius:999px;
    font-size:12px;font-weight:700;padding:7px 14px;cursor:pointer;font-family:"Fragment Mono",monospace;
    transition:background .18s,color .18s;
  }
  .amount-chip:hover{background:var(--violet-dim);color:#0a0b14;border-color:transparent}
  .empty-note{text-align:center;font-size:12px;color:var(--paper-dim2);margin-top:14px}
</style>
<script>
  (function(){
    if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) {
      var s = document.createElement("style");
      s.textContent = "@view-transition{navigation:auto;}";
      document.head.appendChild(s);
    }
    function markDir(){
      var dir = "forward";
      try {
        if (window.navigation && navigation.activation && navigation.activation.navigationType === "traverse") {
          var from = navigation.activation.from, entry = navigation.activation.entry;
          if (from && entry && entry.index < from.index) dir = "back";
        }
      } catch(e){}
      document.documentElement.setAttribute("data-vt-dir", dir);
    }
    markDir();
    document.addEventListener("pagereveal", markDir);
    document.addEventListener("DOMContentLoaded", function(){
      var backBtn = document.getElementById("backBtn");
      if(backBtn) backBtn.addEventListener("click", function(e){
        if(history.length > 1){ e.preventDefault(); history.back(); }
      });
    });
  })();
</script>
</head>
<body>

<div class="topbar">
  <a href="index.html" class="back-btn" id="backBtn" aria-label="Back"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></a>
  <h1 class="title">Convert</h1>
  <div style="width:40px;"></div>
</div>

<div class="wrap">
  <div class="card">
    <div class="field">
      <div class="cur-chip" id="fromChip"><span id="fromLabel">USD</span>
        <div class="cur-popover" id="fromPopover"></div>
      </div>
      <input id="fromInput" type="text" inputmode="decimal" placeholder="100" value="100" />
    </div>
    <button type="button" id="swapBtn" class="swap-btn" aria-label="Swap currencies"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16V4M7 4 4 7M7 4l3 3"/><path d="M17 8v12M17 20l3-3M17 20l-3-3"/></svg></button>
    <div class="field">
      <div class="cur-chip" id="toChip"><span id="toLabel">IQD</span>
        <div class="cur-popover" id="toPopover"></div>
      </div>
      <input id="toInput" type="text" inputmode="decimal" placeholder="0" readonly />
    </div>
    <div class="rate-info" id="rateInfo"></div>
    <div class="amount-chips" id="amountChips">
      <button type="button" class="amount-chip" data-amt="50">50</button>
      <button type="button" class="amount-chip" data-amt="100">100</button>
      <button type="button" class="amount-chip" data-amt="500">500</button>
      <button type="button" class="amount-chip" data-amt="1000">1,000</button>
    </div>
  </div>
  <div class="empty-note" id="emptyNote" style="display:none">Only USD/IQD are configured right now — an admin can add more currencies.</div>
</div>

<script>
  var WORKER_URL = "https://dinar-rate-worker.dollersdaner.workers.dev";

  var CURRENCY_META = {
    USD:{label:"US Dollar", flag:"🇺🇸"}, IQD:{label:"Iraqi Dinar", flag:"🇮🇶"},
    GOLD:{label:"Gold, 24K per gram", flag:"🪙"},
    EUR:{label:"Euro", flag:"🇪🇺"}, GBP:{label:"British Pound", flag:"🇬🇧"}, TRY:{label:"Turkish Lira", flag:"🇹🇷"},
    AED:{label:"UAE Dirham", flag:"🇦🇪"}, SAR:{label:"Saudi Riyal", flag:"🇸🇦"}, KWD:{label:"Kuwaiti Dinar", flag:"🇰🇼"},
    JOD:{label:"Jordanian Dinar", flag:"🇯🇴"}, EGP:{label:"Egyptian Pound", flag:"🇪🇬"}, IRR:{label:"Iranian Rial", flag:"🇮🇷"},
    JPY:{label:"Japanese Yen", flag:"🇯🇵"}, CNY:{label:"Chinese Yuan", flag:"🇨🇳"}, INR:{label:"Indian Rupee", flag:"🇮🇳"},
    CAD:{label:"Canadian Dollar", flag:"🇨🇦"}, AUD:{label:"Australian Dollar", flag:"🇦🇺"}, CHF:{label:"Swiss Franc", flag:"🇨🇭"},
    RUB:{label:"Russian Ruble", flag:"🇷🇺"}, SEK:{label:"Swedish Krona", flag:"🇸🇪"}, NOK:{label:"Norwegian Krone", flag:"🇳🇴"},
    DKK:{label:"Danish Krone", flag:"🇩🇰"}, QAR:{label:"Qatari Riyal", flag:"🇶🇦"}, BHD:{label:"Bahraini Dinar", flag:"🇧🇭"},
    OMR:{label:"Omani Rial", flag:"🇴🇲"}, LBP:{label:"Lebanese Pound", flag:"🇱🇧"},
  };
  function metaFor(code){ return CURRENCY_META[code] || {label:code, flag:"💱"}; }
  function fmt(n){ return n==null ? "—" : Math.round(n).toLocaleString("en-US"); }
  function fmt2(n){ return n==null ? "—" : (Math.abs(n) < 10 ? Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}) : fmt(n)); }

  var iqdPerUnit = { IQD: 1 }; // how many IQD equal 1 unit of this currency
  var PAIR_KEY = "convPair_v1";
  var savedPair = (function(){ try { return JSON.parse(localStorage.getItem(PAIR_KEY)); } catch(e){ return null; } })();
  var fromCode = (savedPair && savedPair.from) || "USD", toCode = (savedPair && savedPair.to) || "IQD";
  function savePair(){
    try { localStorage.setItem(PAIR_KEY, JSON.stringify({from:fromCode, to:toCode})); } catch(e){}
  }
  var fromInput = document.getElementById("fromInput");
  var toInput = document.getElementById("toInput");
  var fromLabel = document.getElementById("fromLabel");
  var toLabel = document.getElementById("toLabel");
  var rateInfo = document.getElementById("rateInfo");

  function availableCodes(){
    return Object.keys(iqdPerUnit);
  }

  function renderOptions(listEl, codes, onPick, popoverEl){
    listEl.innerHTML = codes.map(function(code){
      var m = metaFor(code);
      return '<div class="cur-opt" data-code="'+code+'">'+m.flag+' '+code+' · '+m.label+'</div>';
    }).join("") || '<div class="cur-opt" style="cursor:default;opacity:.6;">No matches</div>';
    listEl.querySelectorAll(".cur-opt[data-code]").forEach(function(opt){
      opt.addEventListener("click", function(e){
        e.stopPropagation();
        popoverEl.classList.remove("open");
        onPick(opt.getAttribute("data-code"));
      });
    });
  }

  function renderPopover(popoverEl, onPick){
    var codes = availableCodes();
    if(codes.length <= 6){
      popoverEl.innerHTML = '<div class="cur-opt-list"></div>';
      renderOptions(popoverEl.querySelector(".cur-opt-list"), codes, onPick, popoverEl);
      return;
    }
    popoverEl.innerHTML =
      '<input type="text" class="cur-search" placeholder="Search currency…" autocomplete="off" />' +
      '<div class="cur-opt-list"></div>';
    var listEl = popoverEl.querySelector(".cur-opt-list");
    renderOptions(listEl, codes, onPick, popoverEl);
    var searchEl = popoverEl.querySelector(".cur-search");
    searchEl.addEventListener("click", function(e){ e.stopPropagation(); });
    searchEl.addEventListener("input", function(){
      var q = searchEl.value.trim().toLowerCase();
      var filtered = !q ? codes : codes.filter(function(code){
        var m = metaFor(code);
        return code.toLowerCase().indexOf(q) !== -1 || m.label.toLowerCase().indexOf(q) !== -1;
      });
      renderOptions(listEl, filtered, onPick, popoverEl);
    });
  }

  function wireChip(chipId, popoverId, onPick){
    var chip = document.getElementById(chipId);
    var pop = document.getElementById(popoverId);
    chip.addEventListener("click", function(e){
      e.stopPropagation();
      document.querySelectorAll(".cur-popover.open").forEach(function(p){ if(p!==pop) p.classList.remove("open"); });
      renderPopover(pop, onPick);
      pop.classList.toggle("open");
      var searchEl = pop.querySelector(".cur-search");
      if(searchEl && pop.classList.contains("open")) setTimeout(function(){ searchEl.focus(); }, 50);
    });
  }

  function flashLabel(el){
    el.classList.add("flash");
    setTimeout(function(){ el.classList.remove("flash"); }, 350);
  }

  wireChip("fromChip", "fromPopover", function(code){ fromCode = code; fromLabel.textContent = metaFor(code).flag+" "+code; flashLabel(fromLabel); savePair(); convert(); });
  wireChip("toChip", "toPopover", function(code){ toCode = code; toLabel.textContent = metaFor(code).flag+" "+code; flashLabel(toLabel); savePair(); convert(); });
  document.addEventListener("click", function(){
    document.querySelectorAll(".cur-popover.open").forEach(function(p){ p.classList.remove("open"); });
  });

  function convert(){
    var fromRate = iqdPerUnit[fromCode], toRate = iqdPerUnit[toCode];
    if(fromRate==null || toRate==null){ toInput.value = ""; rateInfo.textContent = ""; return; }
    var amt = parseFloat((fromInput.value||"").replace(/,/g,""));
    if(isNaN(amt) || amt < 0){ toInput.value = ""; rateInfo.textContent = ""; return; }
    var result = amt * fromRate / toRate;
    toInput.value = fmt2(result);
    var unitRate = fromRate / toRate;
    rateInfo.textContent = "1 " + fromCode + " = " + fmt2(unitRate) + " " + toCode;
  }

  fromInput.addEventListener("input", convert);

  document.getElementById("amountChips").addEventListener("click", function(e){
    var chip = e.target.closest(".amount-chip");
    if(!chip) return;
    fromInput.value = chip.getAttribute("data-amt");
    convert();
  });

  document.getElementById("swapBtn").addEventListener("click", function(){
    var tmp = fromCode; fromCode = toCode; toCode = tmp;
    fromLabel.textContent = metaFor(fromCode).flag+" "+fromCode;
    toLabel.textContent = metaFor(toCode).flag+" "+toCode;
    flashLabel(fromLabel);
    flashLabel(toLabel);
    fromInput.value = toInput.value || fromInput.value;
    savePair();
    convert();
  });

  fromLabel.textContent = metaFor(fromCode).flag+" "+fromCode;
  toLabel.textContent = metaFor(toCode).flag+" "+toCode;

  fetch(WORKER_URL)
    .then(function(r){ return r.json(); })
    .then(function(d){
      var baghdadRate = d.baghdad ? d.baghdad.rate : null; // IQD per 100 USD
      if(baghdadRate!=null) iqdPerUnit.USD = baghdadRate / 100;
      (d.extra||[]).forEach(function(c){
        if(c.iqdPer1!=null) iqdPerUnit[c.code] = c.iqdPer1;
      });
      if(d.gold && d.gold.gram){
        var g24 = d.gold.gram.filter(function(g){ return g.k === 24; })[0];
        if(g24 && g24.iqd != null) iqdPerUnit.GOLD = g24.iqd;
      }
      document.getElementById("emptyNote").style.display = (d.extra && d.extra.length) ? "none" : "";
      convert();
    })
    .catch(function(){
      rateInfo.textContent = "Couldn't load rates right now.";
    });

  fetch(WORKER_URL + "/flags").then(function(r){ return r.json(); }).then(function(d){
    if(d.flags && d.flags.site_operational === false){
      document.body.innerHTML = '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:#090b12;color:#fff;font-family:system-ui,sans-serif"><div style="font-size:40px;margin-bottom:12px">🛠️</div><div style="font-size:18px;font-weight:700;margin-bottom:8px">Down for maintenance</div><div style="font-size:14px;color:#9aa2bd;max-width:320px">Se3rForIQD is temporarily unavailable while we fix something. Please check back soon.</div></div>';
      return;
    }
    if(d.flags && d.flags.page_convert === false){
      document.querySelector(".wrap").innerHTML = '<div class="card"><div style="text-align:center;padding:20px;color:#9aa2bd;">This page is temporarily unavailable.</div></div>';
    }
  }).catch(function(){});
</script>

</body>
</html>
