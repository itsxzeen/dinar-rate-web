<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a0108" />
<title>Se'r · Iraq Dollar Rate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  @keyframes glow{0%,100%{box-shadow:0 0 10px rgba(0,212,255,.5)}50%{box-shadow:0 0 20px rgba(0,212,255,.8)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  @keyframes float{0%,100%{transform:translateY(0px)}50%{transform:translateY(-10px)}}
  @keyframes slideIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}

  :root{
    --dark:#0a0814;
    --dark-2:#0d1220;
    --dark-3:#0f1a2e;
    --purple:#00d4ff;
    --purple-light:#00ffff;
    --purple-dark:#0099cc;
    --paper:#e0f7ff;
    --paper-dim:#7ec5e3;
    --accent:#00ff88;
    --muted:#4a7c99;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--dark);
    color:var(--paper);
    font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;
    line-height:1.5;
    min-height:100vh;
    padding:env(safe-area-inset-top) 0 0;
    position:relative;
    overflow-x:hidden;
    animation:fadeIn .8s ease-out;
  }

  @keyframes spaceDrift{
    0%{background-position:0% 0%}
    50%{background-position:100% 100%}
    100%{background-position:0% 0%}
  }

  #spaceBg{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    z-index:0;
    pointer-events:none;
    background:radial-gradient(circle at 20% 50%, rgba(0,212,255,.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 30%, rgba(0,255,255,.1) 0%, transparent 50%),
                radial-gradient(circle at 30% 80%, rgba(0,200,255,.08) 0%, transparent 50%),
                var(--dark);
    background-size:400% 400%;
    animation:spaceDrift 15s ease-in-out infinite, fadeIn 1.5s ease-out;
  }

  .topbar{
    display:flex;
    align-items:center;
    gap:16px;
    padding:20px 18px;
    border-bottom:1px solid rgba(168,85,247,.2);
    background:var(--dark);
    position:sticky;
    top:0;
    z-index:20;
    animation:slideIn .5s ease-out;
  }

  .menu-btn{
    width:44px;
    height:44px;
    background:var(--dark-2);
    border:1px solid var(--purple);
    border-radius:14px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--purple-light);
    font-size:20px;
    transition:all .3s;
    animation:slideIn .6s ease-out;
  }
  .menu-btn:hover{
    background:var(--dark-3);
    box-shadow:0 0 15px rgba(0,212,255,.3);
  }

  .brand{
    flex:1;
    text-align:center;
    animation:slideIn .7s ease-out;
  }
  .brand-text{
    font-size:32px;
    font-weight:900;
    letter-spacing:2px;
    background:linear-gradient(135deg, #00d4ff, #00ffff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
  }

  .sidebar{
    position:fixed;
    left:0;
    top:0;
    width:280px;
    height:100vh;
    background:var(--dark-2);
    border-right:1px solid var(--purple);
    z-index:100;
    overflow-y:auto;
    transform:translateX(-100%);
    transition:transform .4s cubic-bezier(.4,0,.2,1);
    padding-top:20px;
  }
  .sidebar.open{transform:translateX(0)}
  .sidebar-close{
    position:absolute;
    top:16px;
    right:16px;
    width:32px;
    height:32px;
    background:none;
    border:none;
    color:var(--paper);
    font-size:24px;
    cursor:pointer;
  }
  .sidebar-section{
    padding:20px 16px;
    border-bottom:1px solid rgba(168,85,247,.2);
  }
  .sidebar-title{
    font-size:11px;
    color:var(--purple-light);
    text-transform:uppercase;
    letter-spacing:.08em;
    font-weight:700;
    margin-bottom:12px;
  }
  .sidebar-item{
    padding:12px;
    background:var(--dark-3);
    border:1px solid var(--purple);
    border-radius:10px;
    margin-bottom:8px;
    font-size:13px;
    color:var(--paper);
    text-align:center;
    transition:all .3s;
  }
  .sidebar-item:hover{
    background:var(--purple);
    color:var(--dark);
  }

  .overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.6);
    z-index:99;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s;
    backdrop-filter:blur(4px);
  }
  .overlay.open{opacity:1;pointer-events:auto}

  .currency-drawer{
    position:fixed;
    left:0;
    top:0;
    width:280px;
    height:100vh;
    background:var(--dark-2);
    border-right:1px solid var(--purple);
    z-index:101;
    transform:translateX(-100%);
    transition:transform .4s cubic-bezier(.4,0,.2,1);
    padding:60px 16px 16px;
    overflow-y:auto;
  }
  .currency-drawer.open{transform:translateX(0)}
  .currency-drawer-close{
    position:absolute;
    top:16px;
    right:16px;
    width:32px;
    height:32px;
    background:none;
    border:none;
    color:var(--paper);
    font-size:24px;
    cursor:pointer;
  }
  .currency-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .currency-item{
    background:var(--dark-3);
    border:1px solid var(--purple);
    border-radius:12px;
    padding:16px;
    text-align:center;
    cursor:pointer;
    transition:all .3s;
    position:relative;
    animation:slideIn .5s ease-out backwards;
  }
  .currency-item:nth-child(1){animation-delay:.1s}
  .currency-item:nth-child(2){animation-delay:.2s}
  .currency-item:nth-child(3){animation-delay:.3s}
  .currency-item:nth-child(4){animation-delay:.4s}
  .currency-item:hover{
    background:var(--purple);
    color:var(--dark);
    box-shadow:0 0 20px rgba(0,212,255,.5);
  }
  .currency-item:active{transform:scale(.95)}
  .currency-item .icon{
    font-size:32px;
    margin-bottom:8px;
    animation:float 3s ease-in-out infinite;
  }
  .currency-item .name{
    font-size:14px;
    font-weight:600;
    color:var(--paper);
    margin-bottom:6px;
  }
  .currency-item .badge{
    position:absolute;
    top:-8px;
    right:-8px;
    background:var(--accent);
    color:white;
    font-size:10px;
    padding:3px 6px;
    border-radius:4px;
    font-weight:700;
    animation:pulse 2s ease-in-out infinite;
  }


  .currency-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.6);
    z-index:100;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s;
    backdrop-filter:blur(4px);
  }
  .currency-overlay.open{opacity:1;pointer-events:auto}

  .wrap{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:24px 18px 60px}

  .mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

  .hero{
    background:linear-gradient(135deg, rgba(0,212,255,.1), rgba(0,255,136,.05));
    border:1px solid var(--purple);
    border-radius:24px;
    padding:28px;
    position:relative;
    overflow:hidden;
    box-shadow:0 8px 32px rgba(0,212,255,.2);
    animation:slideIn .6s ease-out;
  }
  .hero::before{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(circle at 100% 0%, rgba(0,212,255,.1), transparent);
    pointer-events:none;
  }

  table{width:100%;border-collapse:collapse;position:relative;z-index:1;}
  thead tr{border-bottom:1px solid rgba(168,85,247,.3);}
  th{padding:14px 8px;text-align:left;font-size:11px;color:var(--purple-light);letter-spacing:.08em;text-transform:uppercase;font-weight:700;}
  th:nth-child(2){text-align:center;}
  tbody tr{border-bottom:1px solid rgba(168,85,247,.2);animation:slideIn .6s ease-out backwards}
  tbody tr:nth-child(1){animation-delay:.2s}
  tbody tr:nth-child(2){animation-delay:.3s}
  tbody tr:last-child{border-bottom:none;}
  td{padding:16px 8px;font-size:15px;font-weight:600;}
  td:nth-child(2){text-align:center;}
  .rate-val{
    font-size:20px;
    background:linear-gradient(135deg, #00ffff, #00ff88);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
    font-weight:700;
    animation:float 4s ease-in-out infinite;
  }

  .refresh{display:flex;align-items:center;justify-content:space-between;margin-top:24px;padding-top:24px;border-top:1px solid rgba(168,85,247,.2);animation:slideIn .7s ease-out;}
  .refresh .cd{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--paper-dim);}
  .refresh button{background:linear-gradient(135deg, var(--dark-3), var(--dark-2));color:var(--purple-light);border:1px solid var(--purple);border-radius:999px;padding:10px 18px;font:600 12px "IBM Plex Sans Arabic",sans-serif;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:all .3s;}
  .refresh button:hover{
    background:var(--purple);
    color:var(--dark);
    box-shadow:0 0 20px rgba(0,212,255,.5);
  }
  .refresh button:active{transform:scale(.96)}
  .refresh button .ic{display:inline-block;transition:transform .8s cubic-bezier(.4,0,.2,1)}
  .refresh button.spin .ic{transform:rotate(360deg)}

  section{margin-top:28px;animation:slideIn .6s ease-out backwards}
  section:nth-of-type(1){animation-delay:.3s}
  section:nth-of-type(2){animation-delay:.4s}

  .h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--purple-light);margin-bottom:14px;display:flex;align-items:center;gap:8px;font-weight:700;}
  .h2::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);animation:pulse 2s ease-in-out infinite}

  .card{
    background:linear-gradient(135deg, rgba(0,212,255,.08), transparent);
    border:1px solid var(--purple);
    border-radius:18px;
    padding:20px;
    box-shadow:0 4px 16px rgba(0,212,255,.15);
    transition:all .3s;
  }
  .card:hover{
    border-color:var(--purple-light);
    box-shadow:0 8px 24px rgba(0,212,255,.25);
  }

  .conv-tabs{display:flex;gap:10px;margin-bottom:14px}
  .conv-tab{
    flex:1;text-align:center;padding:10px 0;border-radius:10px;border:1px solid var(--purple);
    background:var(--dark-3);font-size:11px;font-weight:700;letter-spacing:.05em;
    color:var(--purple-light);cursor:pointer;transition:all .3s;
  }
  .conv-tab.active{
    background:linear-gradient(135deg, var(--purple), #00ff88);
    color:var(--dark);border-color:transparent;
    box-shadow:0 0 20px rgba(0,212,255,.5);
  }

  .field{
    display:flex;align-items:center;background:var(--dark-3);
    border:1px solid var(--purple);border-radius:12px;padding:14px;gap:10px;
    margin-bottom:12px;transition:all .3s;
  }
  .field:focus-within{
    border-color:var(--purple-light);
    box-shadow:0 0 15px rgba(0,212,255,.3);
  }
  .field .cur{font-family:"IBM Plex Mono";font-weight:700;font-size:14px;color:var(--purple-light);min-width:42px}
  .field input{flex:1;background:none;border:none;outline:none;color:var(--paper);font-family:"IBM Plex Mono";font-weight:600;font-size:22px;width:100%;text-align:right}
  .field input::placeholder{color:var(--muted)}

  .history{
    margin-top:28px;padding:20px;background:linear-gradient(135deg, rgba(0,212,255,.08), transparent);
    border:1px solid var(--purple);border-radius:18px;
    animation:slideIn .7s ease-out;
  }
  .history-title{
    font-size:13px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--purple-light);margin-bottom:14px;display:flex;align-items:center;gap:8px;font-weight:700;
  }
  .history-title::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);animation:pulse 2s ease-in-out infinite}
  .history-item{
    display:flex;align-items:center;justify-content:space-between;padding:12px 0;
    border-bottom:1px solid rgba(168,85,247,.2);font-size:12px;
    animation:slideIn .5s ease-out backwards;
  }
  .history-item:nth-child(odd){animation-delay:.1s}
  .history-item:nth-child(even){animation-delay:.2s}
  .history-item:last-child{border-bottom:none;}
  .history-left{display:flex;align-items:center;gap:10px;}
  .history-arrow{font-size:16px;font-weight:700;}
  .history-arrow.up{color:var(--accent);animation:float 2s ease-in-out infinite}
  .history-arrow.down{color:var(--purple-light)}
  .history-time{color:var(--paper-dim);font-size:10px;}
  .history-rate{font-family:"IBM Plex Mono";font-weight:600;color:var(--purple-light);}

  footer{
    margin-top:28px;font-size:11px;color:var(--paper-dim);line-height:1.6;
    text-align:center;padding-bottom:20px;animation:slideIn .8s ease-out;
  }
  footer b{color:var(--purple-light)}

  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important}
  }

  @media (max-width:600px){
    .wrap{padding:18px 14px 60px}
    .hero{padding:20px}
    .card{padding:16px}
    .currency-toggle{width:56px;height:56px;font-size:24px;bottom:24px;left:24px}
  }
</style>
</head>
<body>
<canvas id="spaceBg"></canvas>


<!-- SIDEBAR -->
<div class="overlay" id="overlay"></div>
<div class="sidebar" id="sidebar">
  <button class="sidebar-close" id="sidebarClose">✕</button>

  <div class="sidebar-section">
    <div class="sidebar-title">Profile</div>
    <div class="sidebar-item">👤 Coming Soon</div>
  </div>

  <div class="sidebar-section">
    <div class="sidebar-title">Other Rates</div>
    <div class="sidebar-item">📊 Coming Soon</div>
  </div>

  <div class="sidebar-section">
    <div class="sidebar-title">Other Currencies</div>
    <div class="sidebar-item">💶 EUR</div>
    <div class="sidebar-item">£ GBP</div>
    <div class="sidebar-item">₺ TRY</div>
  </div>
</div>

<!-- TOPBAR -->
<div class="topbar">
  <button class="menu-btn" id="menuBtn">☰</button>
  <div class="brand">
    <div class="brand-text">SE3R</div>
  </div>
  <div style="width:44px;"></div>
</div>

<!-- MAIN CONTENT -->
<div class="wrap">

  <!-- RATES TABLE -->
  <div class="hero">
    <table>
      <thead>
        <tr>
          <th>Market</th>
          <th>Sell</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Erbil</td>
          <td><div class="rate-val mono" id="erbilSell">—</div></td>
        </tr>
        <tr>
          <td>Baghdad</td>
          <td><div class="rate-val mono" id="baghdadSell">—</div></td>
        </tr>
      </tbody>
    </table>

    <div class="refresh">
      <div class="cd">
        <span id="cd">Updating...</span>
      </div>
      <button id="refreshBtn" type="button" aria-label="Refresh now">
        <span class="ic">↻</span><span>Refresh</span>
      </button>
    </div>
  </div>

  <!-- CONVERTER -->
  <section>
    <div class="h2">Convert</div>
    <div class="card">
      <div class="conv-tabs">
        <div class="conv-tab active" id="tabErbil" data-city="erbil">Erbil</div>
        <div class="conv-tab" id="tabBaghdad" data-city="baghdad">Baghdad</div>
      </div>
      <div class="field">
        <span class="cur">USD</span>
        <input id="usd" type="text" inputmode="decimal" placeholder="100" value="100" />
      </div>
      <div class="field">
        <span class="cur">IQD</span>
        <input id="iqd" type="text" inputmode="decimal" placeholder="0" readonly />
      </div>
    </div>
  </section>

  <!-- HISTORY -->
  <div class="history">
    <div class="history-title">Price History</div>
    <div id="historyList"></div>
  </div>

  <footer id="footer">
    <span id="footerNote">by <b>Abdullah Alsudani</b></span>
  </footer>

</div>

<script>
(function(){
  "use strict";
  var WORKER_URL = "https://dinar-rate-worker.dollersdaner.workers.dev";
  var CACHE_KEY = "dinarRates_v2";
  var HISTORY_KEY = "priceHistory_v1";

  var erbilSell = null;
  var baghdadSell = null;
  var convCity = "erbil";
  var priceHistory = [];

  var menuBtn = document.getElementById("menuBtn");
  var sidebar = document.getElementById("sidebar");
  var overlay = document.getElementById("overlay");
  var sidebarClose = document.getElementById("sidebarClose");

  menuBtn.addEventListener("click", function(){ sidebar.classList.add("open"); overlay.classList.add("open"); });
  sidebarClose.addEventListener("click", function(){ sidebar.classList.remove("open"); overlay.classList.remove("open"); });
  overlay.addEventListener("click", function(){ sidebar.classList.remove("open"); overlay.classList.remove("open"); });


  function fmt(n){ return Math.round(n).toLocaleString("en-US"); }
  function fmtFull(n){ return Math.round(n).toString(); }
  function pad(n){ return n<10?"0"+n:""+n; }
  function currentRate(){ return convCity==="baghdad" ? baghdadSell : erbilSell; }

  function loadCache(){ try{ return JSON.parse(localStorage.getItem(CACHE_KEY)); }catch(e){ return null; } }
  function saveCache(o){ try{ localStorage.setItem(CACHE_KEY, JSON.stringify(o)); }catch(e){} }

  function loadHistory(){ try{ return JSON.parse(localStorage.getItem(HISTORY_KEY))||[]; }catch(e){ return []; } }
  function saveHistory(h){ try{ localStorage.setItem(HISTORY_KEY, JSON.stringify(h)); }catch(e){} }

  function addToHistory(city, rate, prevRate){
    priceHistory = loadHistory();
    var now = new Date();
    var timeStr = pad(now.getHours())+":"+pad(now.getMinutes())+":"+pad(now.getSeconds());
    var dateStr = (now.getMonth()+1)+"/"+now.getDate();
    var direction = prevRate==null ? "same" : (rate > prevRate ? "up" : "down");
    priceHistory.unshift({city:city, rate:rate, direction:direction, time:timeStr, date:dateStr});
    if(priceHistory.length > 20) priceHistory = priceHistory.slice(0,20);
    saveHistory(priceHistory);
    renderHistory();
  }

  function renderHistory(){
    var html = "";
    priceHistory.forEach(function(item){
      var arrow = item.direction==="up" ? "↑" : "↓";
      var arrowClass = item.direction==="up" ? "up" : "down";
      html += '<div class="history-item">'+
        '<div class="history-left">'+
        '<span class="history-arrow '+arrowClass+'">'+arrow+'</span>'+
        '<div><div style="font-weight:600">'+item.city+'</div><div class="history-time">'+item.date+' '+item.time+'</div></div>'+
        '</div>'+
        '<div class="history-rate mono">'+fmt(item.rate)+'</div>'+
        '</div>';
    });
    document.getElementById("historyList").innerHTML = html || '<div style="text-align:center;color:var(--paper-dim);padding:16px;font-size:12px;">No history yet</div>';
  }

  function stamp(){
    var n=new Date(), h=n.getHours(), m=pad(n.getMinutes()), s=pad(n.getSeconds());
    var ap=h>=12?"PM":"AM", h12=((h+11)%12)+1;
    document.getElementById("cd").textContent="updated "+h12+":"+m+":"+s+" "+ap;
  }

  function renderRates(){
    document.getElementById("erbilSell").textContent = erbilSell ? fmt(erbilSell) : "—";
    document.getElementById("baghdadSell").textContent = baghdadSell ? fmt(baghdadSell) : "—";
    stamp();
  }

  function convertUsd(){
    var v=parseFloat((document.getElementById("usd").value||"").replace(/,/g,""));
    var r = currentRate();
    if(isNaN(v)||v<0||r==null){ document.getElementById("iqd").value=""; return; }
    document.getElementById("iqd").value = fmt(v*r);
  }

  document.getElementById("usd").addEventListener("input", convertUsd);

  document.getElementById("tabErbil").addEventListener("click", function(){
    convCity = "erbil";
    document.getElementById("tabErbil").classList.add("active");
    document.getElementById("tabBaghdad").classList.remove("active");
    convertUsd();
  });

  document.getElementById("tabBaghdad").addEventListener("click", function(){
    convCity = "baghdad";
    document.getElementById("tabBaghdad").classList.add("active");
    document.getElementById("tabErbil").classList.remove("active");
    convertUsd();
  });

  function fetchLive(){
    return fetch(WORKER_URL)
      .then(function(r){ return r.json().then(function(d){ return {ok:r.ok, data:d}; }); })
      .then(function(res){
        if(!res.ok || res.data.error) throw new Error(res.data.error || "Error");

        var prevErbil = erbilSell;
        var prevBaghdad = baghdadSell;

        if(res.data.erbil) erbilSell = res.data.erbil.rate;
        if(res.data.baghdad) baghdadSell = res.data.baghdad.rate;

        if(erbilSell && (prevErbil==null || erbilSell !== prevErbil)) addToHistory("Erbil", erbilSell, prevErbil);
        if(baghdadSell && (prevBaghdad==null || baghdadSell !== prevBaghdad)) addToHistory("Baghdad", baghdadSell, prevBaghdad);

        saveCache({erbilSell, baghdadSell, fetchedAt: new Date().toISOString()});
        renderRates();
        convertUsd();
        renderHistory();
      })
      .catch(function(err){
        console.error(err);
        var cache = loadCache();
        if(cache){
          erbilSell = cache.erbilSell;
          baghdadSell = cache.baghdadSell;
          renderRates();
          convertUsd();
        }
      });
  }

  priceHistory = loadHistory();
  renderRates();
  renderHistory();
  fetchLive();

  document.getElementById("refreshBtn").addEventListener("click", function(){
    this.classList.add("spin");
    this.disabled = true;
    fetchLive().then(function(){
      setTimeout(function(){
        document.getElementById("refreshBtn").classList.remove("spin");
        document.getElementById("refreshBtn").disabled = false;
      }, 300);
    });
  });

  setInterval(fetchLive, 30000);
})();
</script>
</body>
</html>
