<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#090b12" />
<meta name="description" content="Live Iraqi dinar rates across Baghdad, Erbil, Mosul, Basra, Najaf, Karbala, Duhok, Kirkuk, and Sulaymaniyah." />
<meta name="robots" content="index,follow" />
<link rel="canonical" href="https://se3rforiqd.xyz/other-rates.html" />
<title>Other Rates · Se3rForIQD</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Work+Sans:wght@400;500;600;700&family=Fragment+Mono&display=swap" rel="stylesheet">
<style>
  ::view-transition-old(root),::view-transition-new(root){animation-duration:.32s;animation-timing-function:ease-in-out;}
  html[data-vt-dir="forward"]::view-transition-old(root){animation-name:vt-out-left;}
  html[data-vt-dir="forward"]::view-transition-new(root){animation-name:vt-in-right;}
  html[data-vt-dir="back"]::view-transition-old(root){animation-name:vt-out-right;}
  html[data-vt-dir="back"]::view-transition-new(root){animation-name:vt-in-left;}
  @keyframes vt-out-left{to{transform:translateX(-25%);}}
  @keyframes vt-in-right{from{transform:translateX(100%);}to{transform:translateX(0);}}
  @keyframes vt-out-right{to{transform:translateX(100%);}}
  @keyframes vt-in-left{from{transform:translateX(-100%);}to{transform:translateX(0);}}
  *{box-sizing:border-box;margin:0;padding:0}
  html{height:100%}
  :root{
    --dark:#090b12; --dark-2:rgba(255,255,255,.045); --dark-3:rgba(255,255,255,.065);
    --line:rgba(255,255,255,.09); --line-strong:rgba(255,255,255,.16);
    --paper:#e9ecf8; --paper-dim:#9aa2bd; --paper-dim2:#6b7390; --violet:#8b98ff; --violet-dim:#7c93ff;
  }
  body{
    background:
      radial-gradient(1000px 560px at 8% -10%, rgba(139,152,255,.14), transparent 55%),
      radial-gradient(800px 460px at 100% 0%, rgba(34,211,238,.08), transparent 50%),
      var(--dark);
    background-attachment:fixed;
    color:var(--paper);font-family:"Work Sans",-apple-system,sans-serif;
    min-height:100%;line-height:1.5;-webkit-font-smoothing:antialiased;
  }
  .topbar{
    position:sticky;top:0;z-index:30;
    display:flex;align-items:center;gap:16px;
    padding:max(calc(env(safe-area-inset-top) + 4px), 16px) 18px 14px;
    border-bottom:1px solid var(--line);background:rgba(9,11,18,.72);backdrop-filter:blur(16px);
  }
  .back-btn, .refresh-btn{
    width:40px;height:40px;background:var(--dark-2);border:1px solid var(--line);border-radius:11px;
    color:var(--paper);text-decoration:none;display:flex;align-items:center;justify-content:center;
    flex-shrink:0;cursor:pointer;transition:background .18s,border-color .18s;
  }
  .back-btn:hover, .refresh-btn:hover{background:var(--dark-3);border-color:var(--line-strong)}
  .title{flex:1;text-align:center;font-family:"Fraunces",serif;font-weight:600;font-size:18px;letter-spacing:.005em;margin:0}
  .wrap{max-width:640px;margin:0 auto;padding:24px 18px 40px}
  @media (min-width:900px){ .wrap{max-width:820px;padding-top:44px} }
  .updated{text-align:center;font-size:12px;color:var(--paper-dim2);margin-bottom:16px}

  .card{background:var(--dark-2);border:1px solid var(--line);border-radius:22px;overflow:hidden}
  @media (min-width:700px){ .card{columns:2;column-gap:0} }
  .row{
    display:flex;justify-content:space-between;align-items:center;
    padding:16px 18px;border-bottom:1px solid var(--line);break-inside:avoid;
  }
  .row:last-child{border-bottom:none}
  .row .city{font-weight:600;font-size:15px;color:var(--paper)}
  .row .vals{text-align:right;font-family:"Fragment Mono",monospace}
  .row .iqd{font-weight:700;font-size:16px;color:var(--paper)}
  .row .usd{font-size:11.5px;color:var(--paper-dim2);margin-top:3px}
  .empty{padding:34px;text-align:center;color:var(--paper-dim);font-size:13px}
</style>
<script>
  (function(){
    if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) {
      var s = document.createElement("style");
      s.textContent = "@view-transition{navigation:auto;}";
      document.head.appendChild(s);
    }
    function markDir(){
      var dir = "forward";
      try {
        if (window.navigation && navigation.activation && navigation.activation.navigationType === "traverse") {
          var from = navigation.activation.from, entry = navigation.activation.entry;
          if (from && entry && entry.index < from.index) dir = "back";
        }
      } catch(e){}
      document.documentElement.setAttribute("data-vt-dir", dir);
    }
    markDir();
    document.addEventListener("pagereveal", markDir);
    document.addEventListener("DOMContentLoaded", function(){
      var backBtn = document.getElementById("backBtn");
      if(backBtn) backBtn.addEventListener("click", function(e){
        if(history.length > 1){ e.preventDefault(); history.back(); }
      });
    });
  })();
</script>
</head>
<body>

<div class="topbar">
  <a href="index.html" class="back-btn" id="backBtn" aria-label="Back"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></a>
  <h1 class="title">Iraq Rates · IQD to USD</h1>
  <button class="refresh-btn" id="refreshBtn" type="button" aria-label="Refresh"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
</div>

<div class="wrap">
  <div class="updated" id="updated"></div>
  <div class="card">
    <div id="list" class="empty">Loading…</div>
  </div>
</div>

<script>
  var WORKER_URL = "https://dinar-rate-worker.dollersdaner.workers.dev";

  var CITY_ORDER = ["baghdad","erbil","sulaymaniyah","karbala","najaf","basra","kirkuk","mosul","duhok"];
  var CITY_LABELS = {
    baghdad:"Baghdad", erbil:"Erbil", sulaymaniyah:"Sulaymaniyah", karbala:"Karbala",
    najaf:"Najaf", basra:"Basra", kirkuk:"Kirkuk", mosul:"Mosul", duhok:"Duhok",
  };

  function fmt(n){ return n==null ? "—" : Math.round(n).toLocaleString("en-US"); }
  function fmt2(n){ return n==null ? "—" : Number(n).toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2}); }

  function render(cities){
    var list = document.getElementById("list");
    if(!cities.length){
      list.className = "empty";
      list.textContent = "No rates available right now.";
      return;
    }
    list.className = "";
    var html = "";
    cities.forEach(function(c){
      var usdPer1000 = c.rate ? (1000 / c.rate) * 100 : null; // $ per 1000 IQD
      html += '<div class="row">' +
        '<span class="city">'+c.label+'</span>' +
        '<span class="vals">' +
          '<div class="iqd">'+fmt(c.rate)+' IQD</div>' +
          '<div class="usd">1,000 IQD = $'+fmt2(usdPer1000)+'</div>' +
        '</span>' +
      '</div>';
    });
    list.innerHTML = html;
  }

  function load(){
    var list = document.getElementById("list");
    list.className = "empty";
    list.textContent = "Loading…";
    fetch(WORKER_URL)
      .then(function(r){ return r.json(); })
      .then(function(d){
        var cities = [];
        if(d.baghdad) cities.push({ city:"baghdad", label:CITY_LABELS.baghdad, rate:d.baghdad.rate });
        if(d.erbil) cities.push({ city:"erbil", label:CITY_LABELS.erbil, rate:d.erbil.rate });
        (d.otherCities||[]).forEach(function(c){
          cities.push({ city:c.city, label:CITY_LABELS[c.city] || c.label, rate:c.rate });
        });
        cities.sort(function(a,b){ return CITY_ORDER.indexOf(a.city) - CITY_ORDER.indexOf(b.city); });
        render(cities);
        document.getElementById("updated").textContent = "Updated " + new Date().toLocaleTimeString("en-US");
      })
      .catch(function(){
        list.className = "empty";
        list.textContent = "Couldn't load rates right now.";
      });
  }

  document.getElementById("refreshBtn").addEventListener("click", load);

  fetch(WORKER_URL + "/flags").then(function(r){ return r.json(); }).then(function(d){
    if(d.flags && d.flags.site_operational === false){
      document.body.innerHTML = '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:#090b12;color:#fff;font-family:system-ui,sans-serif"><div style="font-size:40px;margin-bottom:12px">🛠️</div><div style="font-size:18px;font-weight:700;margin-bottom:8px">Down for maintenance</div><div style="font-size:14px;color:#9aa2bd;max-width:320px">Se3rForIQD is temporarily unavailable while we fix something. Please check back soon.</div></div>';
      return;
    }
    if(d.flags && d.flags.page_other_rates === false){
      document.querySelector(".wrap").innerHTML = '<div class="card"><div class="empty">This page is temporarily unavailable.</div></div>';
      return;
    }
    load();
    setInterval(load, 30000);
  }).catch(function(){ load(); setInterval(load, 30000); });
</script>

</body>
</html>
