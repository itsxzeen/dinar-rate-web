<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#020a1a" />
<title>Rate History · Se3rForIQD</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="shortcut icon" href="favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  ::view-transition-old(root),::view-transition-new(root){animation-duration:.32s;animation-timing-function:ease-in-out;}
  html[data-vt-dir="forward"]::view-transition-old(root){animation-name:vt-out-left;}
  html[data-vt-dir="forward"]::view-transition-new(root){animation-name:vt-in-right;}
  html[data-vt-dir="back"]::view-transition-old(root){animation-name:vt-out-right;}
  html[data-vt-dir="back"]::view-transition-new(root){animation-name:vt-in-left;}
  @keyframes vt-out-left{to{transform:translateX(-25%);}}
  @keyframes vt-in-right{from{transform:translateX(100%);}to{transform:translateX(0);}}
  @keyframes vt-out-right{to{transform:translateX(100%);}}
  @keyframes vt-in-left{from{transform:translateX(-100%);}to{transform:translateX(0);}}
  *{box-sizing:border-box;margin:0;padding:0}
  html{height:100%}
  body{
    background:#020a1a;color:#ffffff;font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;
    min-height:100%;line-height:1.5;
  }
  .topbar{
    position:sticky;top:0;z-index:30;
    display:flex;align-items:center;gap:16px;
    padding:max(calc(env(safe-area-inset-top) + 4px), 16px) 18px 14px;
    border-bottom:1px solid rgba(255,255,255,.12);background:#020a1a;
  }
  .back-btn{
    width:44px;height:44px;background:#071b3d;border:1px solid #1a4fa0;border-radius:14px;
    color:#ffffff;font-size:20px;text-decoration:none;display:flex;align-items:center;justify-content:center;
  }
  .title{flex:1;text-align:center;font-size:20px;font-weight:900;letter-spacing:1px;}
  .wrap{max-width:520px;margin:0 auto;padding:20px 18px 40px;}
  .city-tabs{display:flex;gap:8px;margin-bottom:18px;}
  .city-tab{
    flex:1;text-align:center;padding:10px;border-radius:10px;border:1px solid #1a4fa0;
    background:#071b3d;color:#ffffff;cursor:pointer;font-weight:700;font-size:13px;
  }
  .city-tab.active{background:#ffffff;color:#020a1a;border-color:transparent;}
  .row{
    display:flex;justify-content:space-between;align-items:center;
    padding:14px;border-bottom:1px solid rgba(255,255,255,.08);font-family:"IBM Plex Mono",monospace;
  }
  .row:last-child{border-bottom:none;}
  .row .time{font-size:11px;opacity:.7;}
  .row .iqd{font-weight:700;font-size:16px;}
  .card{background:linear-gradient(135deg, rgba(255,255,255,.06), transparent);border:none;border-radius:22px;box-shadow:0 8px 30px rgba(0,0,0,.35);overflow:hidden;}
  .empty{padding:30px;text-align:center;opacity:.7;font-size:13px;}
  .chart-card{margin-bottom:14px;padding:14px 14px 10px;overflow:visible;}
  .chart-range{display:flex;justify-content:space-between;font-size:11px;color:#98989d;font-family:"IBM Plex Mono",monospace;margin-bottom:6px;}
  .chart-box{height:100px;}
  .chart-box svg{width:100%;height:100%;display:block;overflow:visible;}
</style>
<script>
  (function(){
    // Slide page transitions are an iOS-app-only affectation — plain web
    // browsers get no @view-transition rule injected, so navigation is instant.
    if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) {
      var s = document.createElement("style");
      s.textContent = "@view-transition{navigation:auto;}";
      document.head.appendChild(s);
    }
    function markDir(){
      var dir = "forward";
      try {
        if (window.navigation && navigation.activation && navigation.activation.navigationType === "traverse") {
          var from = navigation.activation.from, entry = navigation.activation.entry;
          if (from && entry && entry.index < from.index) dir = "back";
        }
      } catch(e){}
      document.documentElement.setAttribute("data-vt-dir", dir);
    }
    markDir();
    document.addEventListener("pagereveal", markDir);
    document.addEventListener("DOMContentLoaded", function(){
      var backBtn = document.getElementById("backBtn");
      if(backBtn) backBtn.addEventListener("click", function(e){
        if(history.length > 1){ e.preventDefault(); history.back(); }
      });
    });
  })();
</script>
</head>
<body>

<div class="topbar">
  <a href="index.html" class="back-btn" id="backBtn" aria-label="Back"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></a>
  <div class="title">Rate History</div>
  <div style="width:44px;"></div>
</div>

<div class="wrap">
  <div class="city-tabs" id="cityTabs">
    <div class="city-tab active" data-city="erbil">Erbil</div>
    <div class="city-tab" data-city="baghdad">Baghdad</div>
  </div>
  <div class="card chart-card" id="chartCard" style="display:none">
    <div class="chart-range">
      <span>Low <b id="chartMin">—</b></span>
      <span>High <b id="chartMax">—</b></span>
    </div>
    <div class="chart-box" id="chartBox"></div>
  </div>
  <div class="card">
    <div id="list" class="empty">Loading…</div>
  </div>
</div>

<script>
  var WORKER_URL = "https://dinar-rate-worker.dollersdaner.workers.dev";

  function fmt(n){ return n==null ? "—" : Math.round(n).toLocaleString("en-US"); }

  function formatTime(iso){
    var d = new Date(iso.replace(" ", "T")+"Z");
    return d.toLocaleString("en-US", { month:"short", day:"numeric", hour:"2-digit", minute:"2-digit" });
  }

  function renderChart(points){
    var card = document.getElementById("chartCard");
    var box = document.getElementById("chartBox");
    if(!points || points.length < 2){ card.style.display = "none"; return; }
    card.style.display = "";
    var w = 480, h = 100, pad = 6;
    var min = Math.min.apply(null, points), max = Math.max.apply(null, points);
    var range = (max - min) || 1;
    var stepX = (w - pad*2) / (points.length - 1);
    var coords = points.map(function(v, i){
      var x = pad + i*stepX;
      var y = pad + (h - pad*2) * (1 - (v - min)/range);
      return x.toFixed(1) + "," + y.toFixed(1);
    });
    var line = coords.join(" ");
    var area = pad + "," + (h-pad) + " " + line + " " + (w-pad) + "," + (h-pad);
    box.innerHTML =
      '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
      '<polygon points="' + area + '" fill="rgba(90,140,255,.16)"></polygon>' +
      '<polyline points="' + line + '" fill="none" stroke="#5a8cff" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></polyline>' +
      '</svg>';
    document.getElementById("chartMin").textContent = fmt(min) + " IQD";
    document.getElementById("chartMax").textContent = fmt(max) + " IQD";
  }

  function loadHistory(city){
    document.querySelectorAll(".city-tab").forEach(function(t){
      t.classList.toggle("active", t.getAttribute("data-city") === city);
    });
    var list = document.getElementById("list");
    list.className = "empty";
    list.textContent = "Loading…";
    fetch(WORKER_URL+"/rate/history?city="+city+"&limit=20")
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(!d.history || !d.history.length){
          list.className = "empty";
          list.textContent = "No history yet — check back after the next update.";
          document.getElementById("chartCard").style.display = "none";
          return;
        }
        list.className = "";
        var html = "";
        d.history.forEach(function(item){
          html += '<div class="row">'+
            '<span class="time">'+formatTime(item.recorded_at)+'</span>'+
            '<span class="iqd">'+fmt(item.rate)+' IQD</span>'+
            '</div>';
        });
        list.innerHTML = html;
        renderChart(d.history.map(function(item){ return item.rate; }).reverse());
      })
      .catch(function(){
        list.className = "empty";
        list.textContent = "Couldn't load history right now.";
      });
  }

  document.getElementById("cityTabs").addEventListener("click", function(e){
    var tab = e.target.closest(".city-tab");
    if(!tab) return;
    loadHistory(tab.getAttribute("data-city"));
  });

  fetch(WORKER_URL + "/flags").then(function(r){ return r.json(); }).then(function(d){
    if(d.flags && d.flags.page_history === false){
      document.querySelector(".wrap").innerHTML = '<div class="card"><div class="empty">This page is temporarily unavailable.</div></div>';
      return;
    }
    loadHistory("erbil");
  }).catch(function(){ loadHistory("erbil"); });
</script>

</body>
</html>
