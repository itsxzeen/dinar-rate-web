<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#020a1a" />
<meta name="description" content="Find currency exchange shops near you on a live map." />
<title>Map · Se3rForIQD</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  a,button{outline:none}
  html,body{height:100%}
  body{
    background:#020a1a;color:#ffffff;font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;
    line-height:1.5;display:flex;flex-direction:column;overflow:hidden;
  }
  .topbar{
    position:relative;z-index:30;flex-shrink:0;
    display:flex;align-items:center;gap:16px;
    padding:max(calc(env(safe-area-inset-top) + 4px), 16px) 18px 14px;
    border-bottom:1px solid rgba(255,255,255,.12);background:#020a1a;
  }
  .back-btn{
    width:44px;height:44px;background:#071b3d;border:1px solid #1a4fa0;border-radius:14px;
    color:#ffffff;text-decoration:none;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .title{flex:1;text-align:center;font-size:17px;font-weight:900;letter-spacing:.5px;}
  .refresh-btn{
    width:44px;height:44px;background:#071b3d;border:1px solid #1a4fa0;border-radius:14px;
    color:#ffffff;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  }

  #mapArea{position:relative;flex:1 1 auto;min-height:0;}
  #map{position:absolute;inset:0;background:#0c2c5c;}
  #mapStatus{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:12px;padding:24px;text-align:center;background:#020a1a;z-index:5;
  }
  #mapStatus.hidden{display:none;}
  #mapStatus p{font-size:13px;color:#98989d;max-width:280px;}
  .spinner{
    width:28px;height:28px;border-radius:50%;border:3px solid rgba(255,255,255,.15);
    border-top-color:#5b9cff;animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .retry-btn{
    background:#071b3d;border:1px solid #1a4fa0;color:#ffffff;border-radius:999px;
    padding:9px 18px;font-size:13px;font-weight:700;cursor:pointer;
  }

  #sheet{
    flex-shrink:0;max-height:38vh;overflow-y:auto;background:#071b3d;
    border-top:1px solid #1a4fa0;padding:6px 0 calc(10px + env(safe-area-inset-bottom));
  }

  .bottom-nav{
    position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));
    transform:translateX(-50%);z-index:40;
    display:flex;align-items:center;gap:4px;
    width:calc(100% - 32px);max-width:448px;margin:0 auto;
    background:rgba(20,22,30,.55);
    -webkit-backdrop-filter:blur(24px) saturate(180%);
    backdrop-filter:blur(24px) saturate(180%);
    border:1px solid rgba(255,255,255,.14);
    border-radius:999px;
    padding:6px;
    box-shadow:0 10px 30px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.1);
  }
  .nav-item{
    display:flex;align-items:center;justify-content:center;gap:6px;flex:1;
    color:rgba(255,255,255,.6);text-decoration:none;font-size:13px;font-weight:700;
    letter-spacing:.01em;padding:11px 0;border-radius:999px;
    transition:flex .4s cubic-bezier(.34,1.56,.64,1),background .3s ease,color .3s ease,box-shadow .3s ease,transform .2s ease;
    -webkit-tap-highlight-color:transparent;white-space:nowrap;overflow:hidden;
  }
  .nav-item .nav-ic{display:flex;align-items:center;opacity:.85;transition:opacity .2s;}
  .nav-item .nav-ic svg{width:18px;height:18px;}
  .nav-item span:last-child{max-width:0;opacity:0;overflow:hidden;transition:max-width .35s cubic-bezier(.34,1.56,.64,1),opacity .2s ease,margin-left .35s ease;}
  .nav-item.active{
    flex:1.85;background:#30d158;color:#04170c;
    box-shadow:0 4px 16px rgba(48,209,88,.45);
  }
  .nav-item.active .nav-ic{opacity:1;}
  .nav-item.active span:last-child{max-width:70px;opacity:1;margin-left:1px;}
  .nav-item:active{transform:scale(.95);}
  .bottom-nav.nav-dragging .nav-item{transition:flex .12s ease-out,background .12s ease,color .12s ease,box-shadow .12s ease;}
  #sheetHandle{width:36px;height:4px;background:rgba(255,255,255,.25);border-radius:999px;margin:8px auto 4px;}
  .shop-row{
    display:flex;gap:12px;align-items:flex-start;padding:12px 16px;
    border-bottom:1px solid rgba(255,255,255,.08);cursor:pointer;
  }
  .shop-row:last-child{border-bottom:none;}
  .shop-ic{
    width:34px;height:34px;border-radius:10px;background:#020a1a;border:1px solid #1a4fa0;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#5b9cff;margin-top:2px;
  }
  .shop-name{font-size:14px;font-weight:700;color:#ffffff;}
  .shop-addr{font-size:12px;color:#98989d;margin-top:2px;}
  .shop-meta{font-size:11px;color:#636366;margin-top:4px;display:flex;gap:8px;align-items:center;}
  .shop-open{color:#3ee6a8;}
  .shop-closed{color:#ff6b6b;}
  .shop-empty{padding:24px;text-align:center;color:#636366;font-size:13px;}
</style>
</head>
<body>

<div class="topbar">
  <a href="index.html" class="back-btn" id="backBtn" aria-label="Back"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></a>
  <div class="title" data-i18n="mapTitle">Map</div>
  <button class="refresh-btn" id="refreshBtn" type="button" aria-label="Refresh"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
</div>

<div id="mapArea">
  <div id="map"></div>
  <div id="mapStatus">
    <div class="spinner"></div>
    <p id="mapStatusText" data-i18n="findingLocation">Finding your location…</p>
  </div>
</div>

<div id="sheet">
  <div id="sheetHandle"></div>
  <div id="shopList"><div class="shop-empty" data-i18n="loadingShops">Loading nearby shops…</div></div>
</div>


<script>
  function haptic(style){
    try {
      var H = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Haptics;
      if (H) H.impact({ style: style || "LIGHT" });
    } catch(e){}
  }

  // Drag the active pill left/right along the bottom nav — finger stays
  // inside the bar the whole time, pill follows in real time, and it only
  // navigates on release if you land on a different tab than you started.
  (function setupDraggableNav(){
    var nav = document.querySelector(".bottom-nav");
    if (!nav) return;
    var items = Array.prototype.slice.call(nav.querySelectorAll(".nav-item"));
    if (!items.length) return;

    var startX = null, dragging = false, startIndex = -1, lastIndex = -1;

    function activeIndex(){
      for (var i = 0; i < items.length; i++) { if (items[i].classList.contains("active")) return i; }
      return -1;
    }
    function setActiveIndex(i){
      items.forEach(function(el, idx){ el.classList.toggle("active", idx === i); });
    }
    function indexFromX(x){
      var rect = nav.getBoundingClientRect();
      var rel = Math.min(Math.max(x - rect.left, 0), rect.width - 1);
      var i = Math.floor(rel / (rect.width / items.length));
      return Math.min(Math.max(i, 0), items.length - 1);
    }

    nav.addEventListener("touchstart", function(e){
      startX = e.touches[0].clientX;
      startIndex = activeIndex();
      lastIndex = startIndex;
      dragging = false;
      nav.classList.add("nav-dragging");
    }, {passive:true});

    nav.addEventListener("touchmove", function(e){
      if (startX == null) return;
      var x = e.touches[0].clientX;
      if (!dragging && Math.abs(x - startX) > 6) dragging = true;
      if (dragging) {
        var idx = indexFromX(x);
        if (idx !== lastIndex) {
          setActiveIndex(idx);
          lastIndex = idx;
          haptic("LIGHT");
        }
      }
    }, {passive:true});

    nav.addEventListener("touchend", function(){
      nav.classList.remove("nav-dragging");
      if (dragging) {
        var idx = activeIndex();
        var target = items[idx];
        if (idx !== startIndex && target) target.click();
      }
      startX = null;
      dragging = false;
    });

    nav.addEventListener("touchcancel", function(){
      nav.classList.remove("nav-dragging");
      setActiveIndex(startIndex);
      startX = null;
      dragging = false;
    });
  })();

  document.getElementById("backBtn").addEventListener("click", function(e){
    if(history.length > 1){ e.preventDefault(); history.back(); }
  });

  var WORKER_URL = "https://dinar-rate-worker.dollersdaner.workers.dev";

  // Nav labels + page chrome follow the language picked in Profile.
  var LANG_KEY = "lang_v1";
  var I18N = {
    en: { mapTitle:"Map", loadingShops:"Loading nearby shops…", noShops:"No currency exchange shops found nearby.",
      couldntLoad:"Couldn't load nearby shops right now.", findingLocation:"Finding your location…",
      navHome:"Home", navMap:"Map", navConvert:"Convert", navGold:"Gold", navProfile:"Profile" },
    ar: { mapTitle:"الخريطة", loadingShops:"جاري تحميل الصرافات القريبة…", noShops:"لا توجد صرافات قريبة.",
      couldntLoad:"تعذر تحميل الصرافات الآن.", findingLocation:"جاري تحديد موقعك…",
      navHome:"الرئيسية", navMap:"الخريطة", navConvert:"تحويل", navGold:"الذهب", navProfile:"الملف" },
    ku: { mapTitle:"نەخشە", loadingShops:"بارکردنی صەڕافە نزیکەکان…", noShops:"هیچ صەڕافێکی نزیک نەدۆزرایەوە.",
      couldntLoad:"نەتوانرا صەڕافەکان باربکرێن.", findingLocation:"دۆزینەوەی شوێنەکەت…",
      navHome:"ماڵەوە", navMap:"نەخشە", navConvert:"گۆڕین", navGold:"زێڕ", navProfile:"پرۆفایل" },
  };
  var currentLang = localStorage.getItem(LANG_KEY) || "en";
  function t(key){ return (I18N[currentLang] && I18N[currentLang][key]) || I18N.en[key] || key; }
  function applyLang(){
    document.documentElement.lang = currentLang;
    document.querySelectorAll("[data-i18n]").forEach(function(el){
      var v = t(el.getAttribute("data-i18n"));
      if (v != null) el.textContent = v;
    });
  }
  applyLang();
  var DEFAULT_CENTER = { lat: 36.1911, lng: 44.0092 }; // Erbil, fallback if geolocation fails
  var map = null;
  var markers = [];
  var infoWindow = null;
  var userMarker = null;

  var ICON_SHOP = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 6.5c0-1.9-2.2-3.5-5-3.5s-5 1.4-5 3.3c0 1.9 2 2.8 5 3.2s5 1.3 5 3.2c0 1.9-2.2 3.3-5 3.3s-5-1.6-5-3.5"/></svg>';

  function setStatus(text, showRetry){
    var el = document.getElementById("mapStatus");
    var textEl = document.getElementById("mapStatusText");
    if(text == null){ el.classList.add("hidden"); return; }
    el.classList.remove("hidden");
    textEl.textContent = "";
    var spinner = el.querySelector(".spinner");
    if(showRetry){
      if(spinner) spinner.style.display = "none";
      textEl.textContent = text;
      var btn = document.getElementById("statusRetryBtn");
      if(!btn){
        btn = document.createElement("button");
        btn.id = "statusRetryBtn";
        btn.className = "retry-btn";
        btn.textContent = "Retry";
        btn.addEventListener("click", init);
        el.appendChild(btn);
      }
    } else {
      if(spinner) spinner.style.display = "";
      textEl.textContent = text;
      var existingBtn = document.getElementById("statusRetryBtn");
      if(existingBtn) existingBtn.remove();
    }
  }

  function fmtDistance(km){
    if(km < 1) return Math.round(km*1000) + "m away";
    return km.toFixed(1) + "km away";
  }
  function distanceKm(lat1, lng1, lat2, lng2){
    var R = 6371;
    var dLat = (lat2-lat1) * Math.PI/180;
    var dLng = (lng2-lng1) * Math.PI/180;
    var a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  function clearMarkers(){
    markers.forEach(function(m){ m.setMap(null); });
    markers = [];
  }

  function renderShops(center, places){
    clearMarkers();
    var listEl = document.getElementById("shopList");
    if(!places.length){
      listEl.innerHTML = '<div class="shop-empty">' + t("noShops") + '</div>';
      return;
    }
    places.sort(function(a,b){
      if(a.lat==null || b.lat==null) return 0;
      return distanceKm(center.lat, center.lng, a.lat, a.lng) - distanceKm(center.lat, center.lng, b.lat, b.lng);
    });
    listEl.innerHTML = "";
    places.forEach(function(p){
      if(p.lat == null || p.lng == null) return;
      var marker = new google.maps.Marker({
        position: { lat: p.lat, lng: p.lng },
        map: map,
        title: p.name,
      });
      marker.addListener("click", function(){
        showInfo(marker, p);
      });
      markers.push(marker);

      var dist = distanceKm(center.lat, center.lng, p.lat, p.lng);
      var row = document.createElement("div");
      row.className = "shop-row";
      row.innerHTML =
        '<div class="shop-ic">'+ICON_SHOP+'</div>'
        + '<div>'
        +   '<div class="shop-name">'+p.name+'</div>'
        +   (p.address ? '<div class="shop-addr">'+p.address+'</div>' : '')
        +   '<div class="shop-meta">'
        +     '<span>'+fmtDistance(dist)+'</span>'
        +     (p.rating!=null ? '<span>★ '+p.rating+'</span>' : '')
        +     (p.openNow===true ? '<span class="shop-open">Open now</span>' : p.openNow===false ? '<span class="shop-closed">Closed</span>' : '')
        +   '</div>'
        + '</div>';
      row.addEventListener("click", function(){
        map.panTo({ lat: p.lat, lng: p.lng });
        map.setZoom(16);
        showInfo(marker, p);
      });
      listEl.appendChild(row);
    });
  }

  function showInfo(marker, p){
    if(!infoWindow) infoWindow = new google.maps.InfoWindow();
    var html = '<div style="color:#111;font-family:inherit;min-width:160px;">'
      + '<div style="font-weight:700;font-size:13px;">'+p.name+'</div>'
      + (p.address ? '<div style="font-size:12px;color:#555;margin-top:2px;">'+p.address+'</div>' : '')
      + (p.phone ? '<div style="font-size:12px;color:#555;margin-top:4px;">'+p.phone+'</div>' : '')
      + '</div>';
    infoWindow.setContent(html);
    infoWindow.open(map, marker);
  }

  function loadShops(center){
    document.getElementById("shopList").innerHTML = '<div class="shop-empty">' + t("loadingShops") + '</div>';
    fetch(WORKER_URL + "/places/nearby?lat=" + center.lat + "&lng=" + center.lng)
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d.error){
          document.getElementById("shopList").innerHTML = '<div class="shop-empty">' + t("couldntLoad") + '</div>';
          return;
        }
        renderShops(center, d.places || []);
      })
      .catch(function(){
        document.getElementById("shopList").innerHTML = '<div class="shop-empty">' + t("couldntLoad") + '</div>';
      });
  }

  function setupMap(center){
    map = new google.maps.Map(document.getElementById("map"), {
      center: center,
      zoom: 14,
      disableDefaultUI: false,
      zoomControl: true,
      streetViewControl: false,
      mapTypeControl: false,
      fullscreenControl: false,
      styles: [
        { elementType: "geometry", stylers: [{ color: "#0c2c5c" }] },
        { elementType: "labels.text.stroke", stylers: [{ color: "#020a1a" }] },
        { elementType: "labels.text.fill", stylers: [{ color: "#c9d6ff" }] },
        { featureType: "road", elementType: "geometry", stylers: [{ color: "#1a4fa0" }] },
        { featureType: "water", elementType: "geometry", stylers: [{ color: "#071b3d" }] },
        { featureType: "poi", stylers: [{ visibility: "off" }] },
      ],
    });
    userMarker = new google.maps.Marker({
      position: center,
      map: map,
      title: "You are here",
      icon: {
        path: google.maps.SymbolPath.CIRCLE,
        scale: 8,
        fillColor: "#5b9cff",
        fillOpacity: 1,
        strokeColor: "#ffffff",
        strokeWeight: 2,
      },
    });
    setStatus(null);
    loadShops(center);
  }

  function init(){
    setStatus(t("findingLocation"), false);
    if(!navigator.geolocation){
      setupMap(DEFAULT_CENTER);
      return;
    }
    navigator.geolocation.getCurrentPosition(
      function(pos){
        setupMap({ lat: pos.coords.latitude, lng: pos.coords.longitude });
      },
      function(){
        setupMap(DEFAULT_CENTER);
      },
      { timeout: 8000, maximumAge: 60000 }
    );
  }

  document.getElementById("refreshBtn").addEventListener("click", function(){
    if(map){
      var c = map.getCenter();
      loadShops({ lat: c.lat(), lng: c.lng() });
    } else {
      init();
    }
  });

  // Admin kill-switch: if the map page is turned off, show a notice instead.
  fetch(WORKER_URL + "/flags").then(function(r){ return r.json(); }).then(function(d){
    if(d.flags && d.flags.page_map === false){
      var area = document.getElementById("mapArea");
      var sheet = document.getElementById("sheet");
      if(sheet) sheet.style.display = "none";
      if(area) area.innerHTML = '<div id="mapStatus"><p>This page is temporarily unavailable.</p></div>';
    }
  }).catch(function(){});

  window.initSe3rMap = init;
</script>
<script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCjh0tDgqADnGPjFd_LXWDEnQE7jicuDmA&callback=initSe3rMap"></script>

</body>
</html>
